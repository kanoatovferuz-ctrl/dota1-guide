<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 1 Classic Guide — Telegram WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0c0c12; color: #e1e1e6; min-height: 100vh; padding-bottom: 40px; position: relative; }
    body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg.jpg'); background-size: cover; background-position: center top; opacity: 0.4; filter: brightness(1.25) contrast(1.1); z-index: -1; }
    header { background: rgba(15, 15, 25, 0.9); backdrop-filter: blur(10px); padding: 15px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(255, 157, 0, 0.3); text-align: center; }
    h1 { font-size: 18px; color: #ff9d00; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .search-box { width: 100%; max-width: 400px; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 14px; outline: none; margin-bottom: 8px; }
    .feedback-trigger-btn { display: inline-block; width: 100%; max-width: 400px; padding: 6px 10px; background: rgba(255, 157, 0, 0.15); border: 1px solid rgba(255, 157, 0, 0.4); color: #ff9d00; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; }
    .main-tabs { display: flex; justify-content: center; gap: 6px; padding: 12px 10px 6px 10px; }
    .main-tab-btn { flex: 1; max-width: 130px; padding: 10px 0; background: rgba(25, 25, 35, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); color: #aaa; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; text-transform: uppercase; }
    .main-tab-btn.active { background: #ff9d00; color: #000; border-color: #ff9d00; }
    .sub-tabs { display: flex; justify-content: center; gap: 8px; padding: 6px 10px 14px 10px; }
    .sub-tab-btn { padding: 6px 16px; background: rgba(15, 15, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #888; border-radius: 20px; cursor: pointer; font-size: 12px; }
    .sub-tab-btn.sentinel.active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border-color: #2ecc71; }
    .sub-tab-btn.scourge.active { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border-color: #e74c3c; }
    .container { max-width: 800px; margin: 0 auto; padding: 10px 15px; }
    .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .hero-card { background: rgba(20, 20, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
    .hero-avatar { width: 100%; height: 95px; object-fit: cover; border-radius: 6px; background: #151520; margin-bottom: 8px; }
    .hero-title { font-size: 13px; font-weight: bold; color: #fff; }
    .hero-dota1-name { font-size: 11px; color: #ff9d00; margin-top: 2px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 100; padding: 15px; overflow-y: auto; }
    .modal-content { background: #14141e; border: 1px solid #ff9d00; max-width: 500px; margin: 20px auto; border-radius: 12px; padding: 20px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 15px; font-size: 24px; color: #aaa; cursor: pointer; }
    .modal-header { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .modal-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }
    .modal-info h2 { font-size: 18px; color: #fff; }
    .modal-info .dota1-title { font-size: 13px; color: #ff9d00; }
    .bio-text { font-size: 12px; color: #ccc; line-height: 1.6; margin-bottom: 15px; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 8px; border-left: 3px solid #0088cc; }
    .bio-text p { margin-bottom: 8px; }
    .skill-item { background: rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #ff9d00; }
    .skill-name { font-size: 13px; font-weight: bold; color: #2ecc71; margin-bottom: 3px; }
    .skill-desc { font-size: 12px; color: #bbb; }
    .send-tg-btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Dota 1 Classic Guide (112 Heroes)</h1>
    <input type="text" id="search" class="search-box" placeholder="Поиск героя (например, Sven, Invoker)...">
    <button class="feedback-trigger-btn" onclick="openFeedbackModal()">✍️ Написать отзыв / Предложение</button>
  </header>

  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="setAttr('Strength', this)">Strength</button>
    <button class="main-tab-btn" onclick="setAttr('Agility', this)">Agility</button>
    <button class="main-tab-btn" onclick="setAttr('Intelligence', this)">Intelligence</button>
  </div>

  <div class="sub-tabs">
    <button class="sub-tab-btn sentinel active" onclick="setFaction('Sentinel', this)">🌱 Sentinel (Света)</button>
    <button class="sub-tab-btn scourge" onclick="setFaction('Scourge', this)">💀 Scourge (Тьмы)</button>
  </div>

  <div class="container"><div class="hero-grid" id="heroGrid"></div></div>

  <div class="modal" id="heroModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-header">
        <img id="modalImg" class="modal-img" src="" alt="">
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div id="modalDota1" class="dota1-title"></div>
        </div>
      </div>
      <div id="modalBio" class="bio-text"></div>
      <h3 style="font-size: 13px; color: #ff9d00; margin-bottom: 8px;">Способности:</h3>
      <div class="skills-list" id="modalSkills"></div>
      <button class="send-tg-btn" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <div class="modal" id="feedbackModal">
    <div class="modal-content" style="max-width: 400px; margin-top: 50px;">
      <span class="close-btn" onclick="closeFeedbackModal()">&times;</span>
      <h2 style="font-size: 16px; color: #ff9d00; margin-bottom: 12px;">Обратная связь</h2>
      <textarea id="feedbackText" placeholder="Ваше сообщение..." style="width: 100%; height: 90px; padding: 10px; border-radius: 6px; background: #0c0c12; color: #fff; border: 1px solid rgba(255,255,255,0.2); resize: none; margin-bottom: 12px; font-size: 13px;"></textarea>
      <button onclick="sendFeedback()" class="send-tg-btn" style="background: #2ecc71; margin-top: 0;">Отправить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const heroesData = [
      { name: "Sven", dota1: "Rogue Knight", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sven.png", bio: "<p>Сын изгоя-паладина и эльфийки ночного эльфа, Свен вырос с клеймом позора и изгнания, отвергнутый обоими народами. Закаленный суровыми испытаниями, он поклялся следовать непреклонному кодексу ордена Белого Мстителя.</p><p>Однако, столкнувшись с лицемерием и предательством собственных наставников, Свен разрушил священное солнце и уничтожил орден, забрав с собой легендарный двуручный меч Месть.</p><p>Теперь этот одинокий рыцарь блуждает по полям сражений меж двух миров, полагаясь исключительно на свою ярость, стальной клинок и непоколебимую волю.</p>", skills: [{name: "Storm Bolt", desc: "Молот с уроном и станом."}, {name: "Great Cleave", desc: "Пассивный сплеш-урон."}, {name: "Warcry", desc: "Боевой клич на броню и скорость."}, {name: "God's Strength", desc: "Увеличение базового урона."}] },
      { name: "Tiny", dota1: "Stone Giant", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/tiny.png", bio: "<p>Родившись в результате катаклизмов из живой скалы, крошечный голем Тайни изначально был лишь ничтожным осколком горного массива.</p><p>С годами он путешествует, впитывая обломки пород и минералы, становясь всё массивнее и сильнее.</p><p>Его цель — узнать своё истинное происхождение и найти свои корни.</p>", skills: [{name: "Avalanche", desc: "Камнепад по площади."}, {name: "Toss", desc: "Бросок юнита."}, {name: "Tree Grab", desc: "Удар деревом."}, {name: "Grow", desc: "Рост размера и урона."}] },
      { name: "Kunkka", dota1: "Admiral", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/kunkka.png", bio: "<p>Легендарный адмирал флота людей, чья армада пала у проклятого Водоворота.</p><p>Кункка теперь — призрачный фантом прошлых штормов.</p><p>Он вызывает духи кораблей и цунами, чтобы отомстить Scourge.</p>", skills: [{name: "Torrent", desc: "Гейзер воды."}, {name: "Tidebringer", desc: "Удар меча."}, {name: "X Marks the Spot", desc: "Метка возврата."}, {name: "Ghost Ship", desc: "Призрачный корабль."}] },
      { name: "Invoker", dota1: "Kael", attr: "Intelligence", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/invoker.png", bio: "<p>Гений магии, комбинирующий сферы Quas, Wex и Exort.</p><p>Его память хранит десятки мощнейших заклинаний.</p><p>Обрушивает метеориты и солнечные лучи на врагов.</p>", skills: [{name: "Quas/Wex/Exort", desc: "Сферы магии."}, {name: "Invoke", desc: "Синтез магии."}, {name: "Sun Strike", desc: "Солнечный луч."}, {name: "Chaos Meteor", desc: "Метеорит."}] }
    ];

    let currentAttr = 'Strength', currentFaction = 'Sentinel', selectedHero = null;

    function renderHeroes() {
      const grid = document.getElementById('heroGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = heroesData.filter(h => 
        h.attr === currentAttr && h.faction === currentFaction &&
        (h.name.toLowerCase().includes(searchVal) || h.dota1.toLowerCase().includes(searchVal))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">Герои не найдены</div>`;
        return;
      }

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.onclick = () => openModal(h);
        const fallbackImg = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/base.png";
        card.innerHTML = `
          <img src="${h.img}" class="hero-avatar" alt="${h.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
          <div class="hero-title">${h.name}</div>
          <div class="hero-dota1-name">Dota 1: ${h.dota1}</div>
        `;
        grid.appendChild(card);
      });
    }

    function setAttr(attr, btn) {
      currentAttr = attr;
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    function setFaction(faction, btn) {
      currentFaction = faction;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    document.getElementById('search').addEventListener('input', renderHeroes);

    function openModal(hero) {
      selectedHero = hero;
      document.getElementById('modalImg').src = hero.img;
      document.getElementById('modalName').innerText = hero.name;
      document.getElementById('modalDota1').innerText = "Dota 1: " + hero.dota1;
      document.getElementById('modalBio').innerHTML = hero.bio;
      const skillsContainer = document.getElementById('modalSkills');
      skillsContainer.innerHTML = '';
      hero.skills.forEach(s => {
        skillsContainer.innerHTML += `<div class="skill-item"><div class="skill-name">${s.name}</div><div class="skill-desc">${s.desc}</div></div>`;
      });
      document.getElementById('heroModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('heroModal').style.display = 'none'; }
    function openFeedbackModal() { document.getElementById('feedbackModal').style.display = 'block'; }
    function closeFeedbackModal() { document.getElementById('feedbackModal').style.display = 'none'; }

    function sendFeedback() {
      const text = document.getElementById('feedbackText').value.trim();
      if (!text) return alert("Введите текст");
      alert("Отзыв отправлен!");
      closeFeedbackModal();
    }

    renderHeroes();
  </script>
</body>
</html>
