<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таверны Dota 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            -webkit-tap-highlight-color: transparent; /* Убирает синюю подсветку при нажатии на телефоне */
        }
        h1 {
            color: #f59e0b;
            text-align: center;
            font-size: 18px;
            margin: 6px 0 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 11px;
            margin-bottom: 12px;
        }
        
        /* Вкладки (Табы) */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            background: #111827;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 12px 4px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            outline: none;
        }
        .tab-btn.active.str { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .tab-btn.active.agi { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
        .tab-btn.active.int { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }

        /* Контент вкладок */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Карточки героев */
        .hero-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .hero-header {
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .hero-header:active {
            background: #374151;
        }
        .hero-body {
            display: none;
            padding: 14px;
            background: #0d121b;
            border-top: 1px solid #1f2937;
            font-size: 13px;
            line-height: 1.5;
            color: #9ca3af;
        }
        .hero-body.active {
            display: block;
        }
