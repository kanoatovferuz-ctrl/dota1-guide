<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 1 Classic Guide — Telegram WebApp</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0c0c12;
      color: #e1e1e6;
      min-height: 100vh;
      padding-bottom: 40px;
      position: relative;
    }

    /* Фоновое изображение сайта */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.4;
      filter: brightness(1.25) contrast(1.1);
      z-index: -1;
    }

    header {
      background: rgba(15, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 157, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 18px;
      color: #ff9d00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* Основные вкладки атрибутов */
    .main-tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px 6px 10px;
    }

    .main-tab-btn {
      flex: 1;
      max-width: 130px;
      padding: 10px 0;
      background: rgba(25, 25, 35, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #aaa;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
    }

    .main-tab-btn.active {
      background: #ff9d00;
      color: #000;
      border-color: #ff9d00;
      box-shadow: 0 0 10px rgba(255, 157, 0, 0.4);
    }

    /* Подвкладки Фракций (Sentinel / Scourge) */
    .sub-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 6px 10px 14px 10px;
    }

    .sub-tab-btn {
      padding: 6px 16px;
      background: rgba(15, 15, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #888;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .sub-tab-btn.sentinel.active {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border-color: #2ecc71;
    }

    .sub-tab-btn.scourge.active {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border-color: #e74c3c;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 10px 15px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .hero-card {
      background: rgba(20, 20, 32, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hero-card:active {
      transform: scale(0.97);
    }

    .hero-avatar {
      width: 100%;
      height: 95px;
      object-fit: cover;
      border-radius: 6px;
      background: #151520;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .hero-dota1-name {
      font-size: 11px;
      color: #ff9d00;
      margin-top: 2px;
    }

    /* Модальное окно героя */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-content {
      background: #14141e;
      border: 1px solid #ff9d00;
      max-width: 500px;
      margin: 20px auto;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 24px;
      color: #aaa;
      cursor: pointer;
    }

    .modal-header {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }

    .modal-img {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
    }

    .modal-info h2 {
      font-size: 18px;
      color: #fff;
    }

    .modal-info .dota1-title {
      font-size: 13px;
      color: #ff9d00;
    }

    .bio-text {
      font-size: 12px;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid #0088cc;
    }

    .skills-list {
      margin-top: 10px;
    }

    .skill-item {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      border-left: 3px solid #ff9d00;
    }

    .skill-name {
      font-size: 13px;
      font-weight: bold;
      color: #2ecc71;
      margin-bottom: 3px;
    }

    .skill-desc {
      font-size: 12px;
      color: #bbb;
      line-height: 1.4;
    }

    .send-tg-btn {
      width: 100%;
      padding: 12px;
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>

    let currentAttr = 'Strength';
    let currentFaction = 'Sentinel';
    let selectedHero = null;

    function renderHeroes() {
      const grid = document.getElementById('heroGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = heroesData.filter(h => 
        h.attr === currentAttr && 
        h.faction === currentFaction &&
        (h.name.toLowerCase().includes(searchVal) || h.dota1.toLowerCase().includes(searchVal))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">Герои не найдены</div>`;
        return;
      }

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.onclick = () => openModal(h);
        card.innerHTML = `
          <img src="${h.img}" class="hero-avatar" alt="${h.name}">
          <div class="hero-title">${h.name}</div>
          <div class="hero-dota1-name">Dota 1: ${h.dota1}</div>
        `;
        grid.appendChild(card);
      });
    }

    function setAttr(attr, btn) {
      currentAttr = attr;
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    function setFaction(faction, btn) {
      currentFaction = faction;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    document.getElementById('search').addEventListener('input', renderHeroes);

    function openModal(hero) {
      selectedHero = hero;
      document.getElementById('modalImg').src = hero.img;
      document.getElementById('modalName').innerText = hero.name;
      document.getElementById('modalDota1').innerText = "Имя в Dota 1: " + hero.dota1;
      document.getElementById('modalBio').innerText = hero.bio;

      const skillsContainer = document.getElementById('modalSkills');
      skillsContainer.innerHTML = '';

      hero.skills.forEach(s => {
        const item = document.createElement('div');
        item.className = 'skill-item';
        item.innerHTML = `
          <div class="skill-name">${s.name}</div>
          <div class="skill-desc">${s.desc}</div>
        `;
        skillsContainer.appendChild(item);
      });

      document.getElementById('heroModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('heroModal').style.display = 'none';
    }

    document.getElementById('sendTgBtn').addEventListener('click', () => {
      if (tg && selectedHero) {
        tg.sendData(JSON.stringify(selectedHero));
        tg.close();
      } else {
        alert("Выбран герой: " + selectedHero.name + " (" + selectedHero.dota1 + ")");
      }
    });

    // Инициализация при старте
    renderHeroes();
  </script>
