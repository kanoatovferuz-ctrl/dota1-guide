<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 1 Classic Guide — Telegram WebApp</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0c0c12;
      color: #e1e1e6;
      min-height: 100vh;
      padding-bottom: 30px;
      position: relative;
    }

    /* Фоновое изображение сайта (сохраняем твои настройки видимости) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg.jpg'); /* Назови файл картинки bg.jpg в GitHub */
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.4;
      filter: brightness(1.2) contrast(1.1);
      z-index: -1;
    }

    header {
      background: rgba(15, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 157, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 18px;
      color: #ff9d00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* Основные вкладки атрибутов */
    .main-tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px 6px 10px;
    }

    .main-tab-btn {
      flex: 1;
      max-width: 130px;
      padding: 10px 0;
      background: rgba(25, 25, 35, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #aaa;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
    }

    .main-tab-btn.active {
      background: #ff9d00;
      color: #000;
      border-color: #ff9d00;
      box-shadow: 0 0 10px rgba(255, 157, 0, 0.4);
    }

    /* Подвкладки Фракций (Sentinel / Scourge) */
    .sub-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 6px 10px 14px 10px;
    }

    .sub-tab-btn {
      padding: 6px 16px;
      background: rgba(15, 15, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #888;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .sub-tab-btn.sentinel.active {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border-color: #2ecc71;
    }

    .sub-tab-btn.scourge.active {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border-color: #e74c3c;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 10px 15px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .hero-card {
      background: rgba(20, 20, 32, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hero-card:active {
      transform: scale(0.97);
    }

    .hero-avatar {
      width: 100%;
      height: 95px;
      object-fit: cover;
      border-radius: 6px;
      background: #151520;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .hero-dota1-name {
      font-size: 11px;
      color: #ff9d00;
      margin-top: 2px;
    }

    /* Модальное окно персонажа */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-content {
      background: #14141e;
      border: 1px solid #ff9d00;
      max-width: 500px;
      margin: 20px auto;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 24px;
      color: #aaa;
      cursor: pointer;
    }

    .modal-header {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }

    .modal-img {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
    }

    .modal-info h2 {
      font-size: 18px;
      color: #fff;
    }

    .modal-info .dota1-title {
      font-size: 13px;
      color: #ff9d00;
    }

    .skills-list {
      margin-top: 15px;
    }

    .skill-item {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      border-left: 3px solid #ff9d00;
    }

    .skill-name {
      font-size: 13px;
      font-weight: bold;
      color: #2ecc71;
      margin-bottom: 3px;
    }

    .skill-desc {
      font-size: 12px;
      color: #ccc;
      line-height: 1.4;
    }

    .send-tg-btn {
      width: 100%;
      padding: 12px;
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dota 1 Classic Guide</h1>
    <input type="text" id="search" class="search-box" placeholder="Поиск героя или скилла...">
  </header>

  <!-- 3 Вкладки Атрибутов (Строго на английском) -->
  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="setAttr('Strength', this)">Strength</button>
    <button class="main-tab-btn" onclick="setAttr('Agility', this)">Agility</button>
    <button class="main-tab-btn" onclick="setAttr('Intelligence', this)">Intelligence</button>
  </div>

  <!-- Фракции (Sentinel / Scourge) -->
  <div class="sub-tabs">
    <button class="sub-tab-btn sentinel active" onclick="setFaction('Sentinel', this)">🌱 Sentinel (Света)</button>
    <button class="sub-tab-btn scourge" onclick="setFaction('Scourge', this)">💀 Scourge (Тьмы)</button>
  </div>

  <div class="container">
    <div class="hero-grid" id="heroGrid"></div>
  </div>

  <!-- Окно с описанием героя и скиллов -->
  <div class="modal" id="heroModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      
      <div class="modal-header">
        <img id="modalImg" class="modal-img" src="" alt="">
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div id="modalDota1" class="dota1-title"></div>
        </div>
      </div>

      <p id="modalBio" style="font-size: 12px; color: #aaa; margin-bottom: 12px;"></p>

      <h3 style="font-size: 14px; color: #ff9d00; margin-bottom: 8px;">Способности (Skills):</h3>
      <div class="skills-list" id="modalSkills"></div>

      <button class="send-tg-btn" id="sendTgBtn">Выбрать героя в Telegram</button>
    </div>
  </div>

  <script>
    // Интеграция с Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // База данных героев Dota 1 по каноничным тавернам
    const heroesData = [
      // === STRENGTH SENTINEL ===
      {
        name: "Sven", dota1: "Rogue Knight", attr: "Strength", faction: "Sentinel",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sven.png",
        bio: "Мощный воин ближнего боя, крушащий врагов групповыми станами и огромным уроном.",
        skills: [
          { name: "Storm Bolt", desc: "Бросает магический молот, наносящий урон и оглушающий врагов в области." },
          { name: "Great Cleave", desc: "Пассивно наносит урон всем стоящим рядом врагам при обычной атаке." },
          { name: "Warcry", desc: "Издает боевой клич, повышая скорость передвижения и броню союзников." },
          { name: "God's Strength", desc: "Ультимейт: Увеличивает базовый урон Sven на 100%/150%/200%." }
        ]
      },
      {
        name: "Earthshaker", dota1: "Raigor Stonehoof", attr: "Strength", faction: "Sentinel",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/earthshaker.png",
        bio: "Мастер контроля земли, способный перекрывать пути и устраивать массовый коллапс.",
        skills: [
          { name: "Fissure", desc: "Создает непроходимую каменную стену, оглушающую врагов." },
          { name: "Enchant Totem", desc: "Заряжает тотем, давая огромный бонус к следующей атаке." },
          { name: "Aftershock", desc: "Пассивно оглушает врагов вокруг при применении любого заклинания." },
          { name: "Echo Slam", desc: "Ультимейт: Пускает волну, наносящую урон за каждого врага в области." }
        ]
      },

      // === STRENGTH SCOURGE ===
      {
        name: "Axe", dota1: "Mogul Khan", attr: "Strength", faction: "Scourge",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/axe.png",
        bio: "Бесстрашный орк, заставляющий врагов атаковать себя и рубящий их топором.",
        skills: [
          { name: "Berserker's Call", desc: "Принуждает ближайших врагов атаковать Axe, давая ему дополнительную броню." },
          { name: "Battle Hunger", desc: "Замедляет врага и наносит периодический урон, пока тот кого-то не убьет." },
          { name: "Counter Helix", desc: "При получении удара с шансом вращается, нанося урон всем вокруг." },
          { name: "Culling Blade", desc: "Ультимейт: Мгновенно добивает врага с низким уровнем здоровья." }
        ]
      },
      {
        name: "Pudge", dota1: "Butcher", attr: "Strength", faction: "Scourge",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png",
        bio: "Ужасный мясник, притягивающий жертв окровавленным крюком.",
        skills: [
          { name: "Meat Hook", desc: "Запускает окровавленный крюк, притягивающий первого попавшегося юнита." },
          { name: "Rot", desc: "Выделяет ядовитое облако, замедляющее и наносящее урон врагам и самому себе." },
          { name: "Flesh Heap", desc: "Дает сопротивление магии и пассивно увеличивает силу за каждого убитого врага." },
          { name: "Dismember", desc: "Ультимейт: Пожирает цель, оглушая ее и нанося урон в течение нескольких секунд." }
        ]
      },

      // === AGILITY SENTINEL ===
      {
        name: "Juggernaut", dota1: "Yurnero", attr: "Agility", faction: "Sentinel",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/juggernaut.png",
        bio: "Мастер самурайского клинка, невосприимчивый к магии во время вихря.",
        skills: [
          { name: "Blade Fury", desc: "Крутится в вихре клинков, нанося урон и получая невосприимчивость к магии." },
          { name: "Healing Ward", desc: "Призывает тотем, который лечит всех союзников неподалеку в % от HP." },
          { name: "Blade Dance", desc: "Пассивный шанс нанести критический урон при атаке." },
          { name: "Omnislash", desc: "Ультимейт: Неудержимо прыгает по врагам, нанося мгновенные удары." }
        ]
      },
      {
        name: "Anti-Mage", dota1: "Magina", attr: "Agility", faction: "Sentinel",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/antimage.png",
        bio: "Быстрый охотник на магов, сжигающий ману и перемещающийся блинком.",
        skills: [
          { name: "Mana Break", desc: "Каждая атака сжигает ману цели и наносит дополнительный урон." },
          { name: "Blink", desc: "Телепортирует героя на небольшое расстояние." },
          { name: "Counterspell", desc: "Пассивно увеличивает сопротивление магии." },
          { name: "Mana Void", desc: "Ультимейт: Взрывает цель на основе отсутствующей у нее маны." }
        ]
      },

      // === AGILITY SCOURGE ===
      {
        name: "Shadow Fiend", dota1: "Nevermore", attr: "Agility", faction: "Scourge",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/nevermore.png",
        bio: "Демон, поглощающий души павших врагов для увеличения собственной силы.",
        skills: [
          { name: "Shadowraze", desc: "Выпускает теневые взрывы на трех разных дистанциях (Z, X, C)." },
          { name: "Necromastery", desc: "Поглощает душу каждого убитого юнита, получая бонус к урону." },
          { name: "Presence of the Dark Lord", desc: "Снижает броню всех ближайших вражеских юнитов." },
          { name: "Requiem of Souls", desc: "Ультимейт: Выпускает накопленные души, нанося огромный урон и страх." }
        ]
      },
      {
        name: "Drow Ranger", dota1: "Traxex", attr: "Agility", faction: "Scourge",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/drow_ranger.png",
        bio: "Ледяная лучница, поражающая врагов замедляющими стрелами и молчанием.",
        skills: [
          { name: "Frost Arrows", desc: "Ледяные стрелы, замедляющие скорость передвижения цели." },
          { name: "Gust", desc: "Выпускает волну, отбрасывающую врагов и накладывающую молчание (Silence)." },
          { name: "Precision Aura", desc: "Дает дополнительный урон всем дальним атакам союзников." },
          { name: "Marksmanship", desc: "Ультимейт: Дает шанс пробить броню врага и нанести чистый урон." }
        ]
      },

      // === INTELLIGENCE SENTINEL ===
      {
        name: "Crystal Maiden", dota1: "Rylai", attr: "Intelligence", faction: "Sentinel",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/crystal_maiden.png",
        bio: "Маг льда, замораживающая врагов и восстанавливающая ману всей команде.",
        skills: [
          { name: "Crystal Nova", desc: "Взрыв льда, замедляющий скорость атаки и движения в области." },
          { name: "Frostbite", desc: "Заковывает врага в лед, запрещая двигаться и атаковать." },
          { name: "Arcane Aura", desc: "Пассивно ускоряет регенерацию маны у всех союзников на карте." },
          { name: "Freezing Field", desc: "Ультимейт: Создает вокруг себя ледяную бурю со случайными взрывами." }
        ]
      },

      // === INTELLIGENCE SCOURGE ===
      {
        name: "Invoker", dota1: "Kael", attr: "Intelligence", faction: "Scourge",
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/invoker.png",
        bio: "Властелин магии, комбинирующий 3 стихийные сферы Quas, Wex и Exort.",
        skills: [
          { name: "Quas / Wex / Exort", desc: "Сферы льда, молнии и огня, дающие различные бонусы." },
          { name: "Invoke", desc: "Комбинирует текущие сферы для создания нового заклинания." },
          { name: "Sun Strike", desc: "Посылает мощный луч в любую точку карты, наносящий чистый урон." },
          { name: "Chaos Meteor", desc: "Ультимейт: Сбрасывает с небес пылающий метеорит." }
        ]
      }
    ];

    let currentAttr = 'Strength';
    let currentFaction = 'Sentinel';
    let selectedHero = null;

    function renderHeroes() {
      const grid = document.getElementById('heroGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = heroesData.filter(h => 
        h.attr === currentAttr && 
        h.faction === currentFaction &&
        (h.name.toLowerCase().includes(searchVal) || h.dota1.toLowerCase().includes(searchVal))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">Герои не найдены</div>`;
        return;
      }

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.onclick = () => openModal(h);
        card.innerHTML = `
          <img src="${h.img}" class="hero-avatar" alt="${h.name}">
          <div class="hero-title">${h.name}</div>
          <div class="hero-dota1-name">Dota 1: ${h.dota1}</div>
        `;
        grid.appendChild(card);
      });
    }

    function setAttr(attr, btn) {
      currentAttr = attr;
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    function setFaction(faction, btn) {
      currentFaction = faction;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    document.getElementById('search').addEventListener('input', renderHeroes);

    function openModal(hero) {
      selectedHero = hero;
      document.getElementById('modalImg').src = hero.img;
      document.getElementById('modalName').innerText = hero.name;
      document.getElementById('modalDota1').innerText = "Имя в Dota 1: " + hero.dota1;
      document.getElementById('modalBio').innerText = hero.bio;

      const skillsContainer = document.getElementById('modalSkills');
      skillsContainer.innerHTML = '';

      hero.skills.forEach(s => {
        const item = document.createElement('div');
        item.className = 'skill-item';
        item.innerHTML = `
          <div class="skill-name">${s.name}</div>
          <div class="skill-desc">${s.desc}</div>
        `;
        skillsContainer.appendChild(item);
      });

      document.getElementById('heroModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('heroModal').style.display = 'none';
    }

    document.getElementById('sendTgBtn').addEventListener('click', () => {
      if (tg && selectedHero) {
        tg.sendData(JSON.stringify(selectedHero));
        tg.close();
      } else {
        alert("Выбран герой: " + selectedHero.name + " (" + selectedHero.dota1 + ")");
      }
    });

    // Инициализация при старте
    renderHeroes();
  </script>
</body>
</html>
