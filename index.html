<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Classic Guide — Telegram WebApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Russo One', sans-serif !important; 
      letter-spacing: 0.5px;
    }

    body { 
      background-color: #0c0c12; 
      color: #e1e1e6; 
      min-height: 100vh; 
      padding-bottom: 40px; 
      position: relative; 
    }

    body::before { 
      content: ""; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background-image: url('bg.jpg'); 
      background-size: cover; 
      background-position: center top; 
      opacity: 0.4; 
      filter: brightness(1.25) contrast(1.1); 
      z-index: -1; 
    }

    header { 
      background: rgba(15, 15, 25, 0.9); 
      backdrop-filter: blur(10px); 
      padding: 15px 15px 20px 15px; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
      border-bottom: 1px solid rgba(255, 157, 0, 0.3); 
      text-align: center; 
    }

    h1 { 
      font-size: 24px; 
      color: #ff9d00; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 14px; 
    }

    .search-box { 
      width: 100%; 
      max-width: 400px; 
      padding: 10px 14px; 
      border-radius: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      background: rgba(0, 0, 0, 0.6); 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
      margin-top: 4px;
      margin-bottom: 10px; 
    }

    .feedback-trigger-btn { 
      display: inline-block; 
      width: 100%; 
      max-width: 400px; 
      padding: 7px 10px; 
      background: rgba(255, 157, 0, 0.15); 
      border: 1px solid rgba(255, 157, 0, 0.4); 
      color: #ff9d00; 
      font-weight: 600; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 11px; 
      text-transform: uppercase; 
    }
    
    .main-tabs { display: flex; justify-content: center; gap: 6px; padding: 12px 10px 6px 10px; }
    .main-tab-btn { flex: 1; max-width: 130px; padding: 10px 0; background: rgba(25, 25, 35, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); color: #aaa; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; }
    .main-tab-btn.active { background: #ff9d00; color: #000; border-color: #ff9d00; }
    
    .sub-tabs { display: flex; justify-content: center; gap: 8px; padding: 6px 10px 14px 10px; }
    .sub-tab-btn { padding: 8px 18px; background: rgba(15, 15, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #888; border-radius: 20px; cursor: pointer; font-size: 11px; text-transform: uppercase; }
    .sub-tab-btn.sentinel.active { background: rgba(46, 204, 113, 0.25); color: #2ecc71; border-color: #2ecc71; }
    .sub-tab-btn.scourge.active { background: rgba(231, 76, 60, 0.25); color: #e74c3c; border-color: #e74c3c; }

    .container { max-width: 800px; margin: 0 auto; padding: 10px 15px; }
    .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .hero-card { background: rgba(20, 20, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
    .hero-avatar { width: 100%; height: 95px; object-fit: cover; border-radius: 6px; background: #151520; margin-bottom: 8px; }
    .hero-title { font-size: 13px; color: #fff; }
    .hero-dota1-name { font-size: 11px; color: #ff9d00; margin-top: 2px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 100; padding: 15px; overflow-y: auto; }
    .modal-content { background: #14141e; border: 1px solid #ff9d00; max-width: 500px; margin: 20px auto; border-radius: 12px; padding: 20px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 15px; font-size: 24px; color: #aaa; cursor: pointer; }
    .modal-header { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .modal-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }
    .modal-info h2 { font-size: 18px; color: #fff; }
    .modal-info .dota1-title { font-size: 13px; color: #ff9d00; }
    
    .bio-text { font-size: 12px; color: #dcdce6; line-height: 1.6; margin-bottom: 12px; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 8px; border-left: 3px solid #0088cc; }
    .bio-text p { margin-bottom: 8px; }
    
    .guide-dropdown-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 157, 0, 0.3); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .toggle-guide-btn { background: rgba(255, 157, 0, 0.15); border: 1px solid rgba(255, 157, 0, 0.4); color: #ff9d00; font-size: 11px; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; text-align: center; text-transform: uppercase; }
    .guide-content-box { display: none; margin-top: 8px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px; font-size: 11px; color: #ccc; line-height: 1.5; }
    
    .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .item-card-mini { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 5px; text-align: center; }
    .item-icon { width: 36px; height: 36px; border-radius: 4px; border: 1px solid #888; object-fit: cover; background: #000; margin-bottom: 3px; display: block; margin-left: auto; margin-right: auto; }
    .item-name-mini { font-size: 9px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage-title { font-size: 11px; font-weight: bold; color: #ff9d00; margin: 8px 0 4px 0; text-transform: uppercase; }

    .skill-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #ff9d00; }
    .skill-header { display: flex; align-items: center; gap: 10px; }
    .skill-icon { width: 42px; height: 42px; border-radius: 6px; border: 1px solid #ff9d00; object-fit: cover; background: #151520; }
    .skill-info-title { flex: 1; }
    .skill-name { font-size: 13px; color: #2ecc71; }
    .skill-type { font-size: 10px; color: #ff9d00; text-transform: uppercase; }
    
    .toggle-levels-btn { margin-top: 6px; background: rgba(255, 157, 0, 0.12); border: 1px solid rgba(255, 157, 0, 0.3); color: #ff9d00; font-size: 11px; padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; text-align: center; text-transform: uppercase; }
    .skill-levels-container { display: none; margin-top: 6px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 6px; }
    .level-row { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; padding: 3px 0; }
    
    .send-tg-btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Dota 2 Guide</h1>
    <input type="text" id="search" class="search-box" placeholder="Поиск героя (например, Sven)...">
    <button class="feedback-trigger-btn" onclick="openFeedbackModal()">✍️ Написать отзыв / Предложение</button>
  </header>

  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="setAttr('Strength', this)">Strength</button>
    <button class="main-tab-btn" onclick="setAttr('Agility', this)">Agility</button>
    <button class="main-tab-btn" onclick="setAttr('Intelligence', this)">Intelligence</button>
  </div>

  <div class="sub-tabs">
    <button class="sub-tab-btn sentinel active" onclick="setFaction('Sentinel', this)">SENTINEL</button>
    <button class="sub-tab-btn scourge" onclick="setFaction('Scourge', this)">SCOURGE</button>
  </div>

  <div class="container"><div class="hero-grid" id="heroGrid"></div></div>

  <!-- Модальное окно героя -->
  <div class="modal" id="heroModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-header">
        <img id="modalImg" class="modal-img" src="" alt="">
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div id="modalDota1" class="dota1-title"></div>
        </div>
      </div>
      
      <div id="modalBio" class="bio-text"></div>

      <!-- Кнопка: Сборка предметов -->
      <div class="guide-dropdown-card">
        <button class="toggle-guide-btn" onclick="toggleGuideSection('itemsBox')">⚔️ Сборка предметов (Build)</button>
        <div class="guide-content-box" id="itemsBox"></div>
      </div>

      <!-- Кнопка: Контрпики и советы -->
      <div class="guide-dropdown-card" style="border-color: rgba(46, 204, 113, 0.4);">
        <button class="toggle-guide-btn" style="background: rgba(46, 204, 113, 0.15); border-color: rgba(46, 204, 113, 0.4); color: #2ecc71;" onclick="toggleGuideSection('countersBox')">🛡️ Контрпики и советы</button>
        <div class="guide-content-box" id="countersBox"></div>
      </div>

      <h3 style="font-size: 13px; color: #ff9d00; margin: 12px 0 8px 0; text-transform: uppercase;">Способности:</h3>
      <div class="skills-list" id="modalSkills"></div>
      
      <button class="send-tg-btn" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <!-- Модальное окно отзыва -->
  <div class="modal" id="feedbackModal">
    <div class="modal-content" style="max-width: 400px; margin-top: 50px;">
      <span class="close-btn" onclick="closeFeedbackModal()">&times;</span>
      <h2 style="font-size: 16px; color: #ff9d00; margin-bottom: 12px;">Обратная связь</h2>
      <textarea id="feedbackText" placeholder="Ваше сообщение..." style="width: 100%; height: 90px; padding: 10px; border-radius: 6px; background: #0c0c12; color: #fff; border: 1px solid rgba(255,255,255,0.2); resize: none; margin-bottom: 12px; font-size: 13px;"></textarea>
      <button onclick="sendFeedback()" class="send-tg-btn" style="background: #2ecc71; margin-top: 0;">Отправить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const heroesData = [
      { 
        name: "Sven", dota1: "Rogue Knight", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sven.png", 
        bio: "<p>Сын изгоя-паладина и эльфийки ночного эльфа, Свен вырос с клеймом позора и изгнания, отвергнутый обоими народами. Закаленный суровыми испытаниями, он поклялся следовать непреклонному кодексу ордена Белого Мстителя.</p><p>Однако, столкнувшись с лицемерием и предательством собственных наставников, Свен разрушил священное солнце и уничтожил орден, забрав с собой легендарный двуручный меч Месть.</p>", 
        
        // Исправленные названия и 100% точные ссылки на иконки предметов из базы Dota 2
        itemsBuild: {
          early: [
            { name: "Tango", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/tango.png" },
            { name: "Salve", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/flask.png" },
            { name: "Quelling", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/quelling_blade.png" },
            { name: "Bracer", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/bracer.png" },
            { name: "Branch", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png" },
            { name: "Branch", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png" }
          ],
          mid: [
            { name: "Power Treads", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/power_treads.png" },
            { name: "Echo Sabre", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/echo_sabre.png" },
            { name: "Blink Dagger", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/blink.png" },
            { name: "Madness", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/mask_of_madness.png" },
            { name: "Magic Wand", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/magic_wand.png" }
          ],
          late: [
            { name: "BKB", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/black_king_bar.png" },
            { name: "Daedalus", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/daedalus.png" },
            { name: "Satanic", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/satanic.png" },
            { name: "Assault", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/assault.png" },
            { name: "Tarrasque", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/heart.png" },
            { name: "Boots of Travel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/travel_boots.png" }
          ]
        },

        countersInfo: `
          <div style="margin-bottom:6px;"><b style="color:#2ecc71;">Силен на линии с:</b> Crystal Maiden, Ogre Magi, Lion (герои с мощными станами и замедлениями).</div>
          <div style="margin-bottom:6px;"><b style="color:#3498db;">Силен против:</b> Героев с плотным расположением в группе и иллюзионистами (благодаря сплешу Great Cleave).</div>
          <div><b style="color:#e74c3c;">Контрят (уязвим к):</b> Bane, Shadow Demon (дизейблы сквозь BKB), а также Ghost Scepter и Eul's Scepter.</div>
        `,

        skills: [
          {
            name: "Storm Bolt",
            img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/sven_storm_bolt.png",
            desc: "Бросает магический молот, наносящий урон и оглушающий врагов в области.",
            isPassive: false,
            levels: [
              { lvl: 1, mana: "110 МАНА", cd: "18 СЕК", effect: "110 урона, стан 1.4 сек" },
              { lvl: 2, mana: "120 МАНА", cd: "16 СЕК", effect: "160 урона, стан 1.6 сек" },
              { lvl: 3, mana: "130 МАНА", cd: "14 СЕК", effect: "210 урона, стан 1.8 сек" },
              { lvl: 4, mana: "140 МАНА", cd: "12 СЕК", effect: "260 урона, стан 2.0 сек" }
            ]
          },
          {
            name: "Great Cleave",
            img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/sven_great_cleave.png",
            desc: "Пассивно наполняет меч силой, нанося пробивающий сплеш-урон всем стоящим рядом врагам.",
            isPassive: true,
            levels: [
              { lvl: 1, mana: "ПАССИВНО", cd: "0 СЕК", effect: "30% сплеш-урона" },
              { lvl: 2, mana: "ПАССИВНО", cd: "0 СЕК", effect: "45% сплеш-урона" },
              { lvl: 3, mana: "ПАССИВНО", cd: "0 СЕК", effect: "60% сплеш-урона" },
              { lvl: 4, mana: "ПАССИВНО", cd: "0 СЕК", effect: "75% сплеш-урона" }
            ]
          },
          {
            name: "Warcry",
            img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/sven_warcry.png",
            desc: "Боевой клич воодушевляет союзников, увеличивая их броню и скорость передвижения.",
            isPassive: false,
            levels: [
              { lvl: 1, mana: "40 МАНА", cd: "32 СЕК", effect: "+6 брони, +8% бега" },
              { lvl: 2, mana: "50 МАНА", cd: "26 СЕК", effect: "+9 брони, +12% бега" },
              { lvl: 3, mana: "60 МАНА", cd: "20 СЕК", effect: "+12 брони, +16% бега" },
              { lvl: 4, mana: "70 МАНА", cd: "14 СЕК", effect: "+15 брони, +20% бега" }
            ]
          },
          {
            name: "God's Strength",
            img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/sven_gods_strength.png",
            desc: "Свен обращается к своей скрытой силе, многократно увеличивая базовый урон от атак.",
            isPassive: false,
            levels: [
              { lvl: 1, mana: "100 МАНА", cd: "100 СЕК", effect: "+120% базового урона" },
              { lvl: 2, mana: "150 МАНА", cd: "100 СЕК", effect: "+160% базового урона" },
              { lvl: 3, mana: "200 МАНА", cd: "100 СЕК", effect: "+200% базового урона" }
            ]
          }
        ]
      },
      { name: "Tiny", dota1: "Stone Giant", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/tiny.png", bio: "<p>Родившись в результате катаклизмов из живой скалы, крошечный голем Тайни изначально был лишь ничтожным осколком горного массива.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Скоро появится.", skills: [{name: "Avalanche", desc: "Камнепад по площади."}] }
    ];

    let currentAttr = 'Strength', currentFaction = 'Sentinel', selectedHero = null;

    function renderHeroes() {
      const grid = document.getElementById('heroGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = heroesData.filter(h => 
        h.attr === currentAttr && h.faction === currentFaction &&
        (h.name.toLowerCase().includes(searchVal) || h.dota1.toLowerCase().includes(searchVal))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">Герои не найдены</div>`;
        return;
      }

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.onclick = () => openModal(h);
        const fallbackImg = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/base.png";
        card.innerHTML = `
          <img src="${h.img}" class="hero-avatar" alt="${h.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
          <div class="hero-title">${h.name}</div>
          <div class="hero-dota1-name">Dota 1: ${h.dota1}</div>
        `;
        grid.appendChild(card);
      });
    }

    function setAttr(attr, btn) {
      currentAttr = attr;
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    function setFaction(faction, btn) {
      currentFaction = faction;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    document.getElementById('search').addEventListener('input', renderHeroes);

    function openModal(hero) {
      selectedHero = hero;
      document.getElementById('modalImg').src = hero.img;
      document.getElementById('modalName').innerText = hero.name;
      document.getElementById('modalDota1').innerText = "Dota 1: " + hero.dota1;
      document.getElementById('modalBio').innerHTML = hero.bio;
      
      const itemsBox = document.getElementById('itemsBox');
      if (hero.itemsBuild && (hero.itemsBuild.early.length > 0 || hero.itemsBuild.mid.length > 0 || hero.itemsBuild.late.length > 0)) {
        let itemsHtml = `<div class="stage-title">🌱 Начало игры (Early Game)</div><div class="items-grid">`;
        hero.itemsBuild.early.forEach(item => {
          itemsHtml += `<div class="item-card-mini"><img src="${item.img}" class="item-icon" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';"><div class="item-name-mini">${item.name}</div></div>`;
        });
        itemsHtml += `</div>`;
        
        itemsHtml += `<div class="stage-title">⚡ Середина игры (Mid Game)</div><div class="items-grid">`;
        hero.itemsBuild.mid.forEach(item => {
          itemsHtml += `<div class="item-card-mini"><img src="${item.img}" class="item-icon" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';"><div class="item-name-mini">${item.name}</div></div>`;
        });
        itemsHtml += `</div>`;

        itemsHtml += `<div class="stage-title">👑 Лейт / 6 Слотов (Late Game)</div><div class="items-grid">`;
        hero.itemsBuild.late.forEach(item => {
          itemsHtml += `<div class="item-card-mini"><img src="${item.img}" class="item-icon" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';"><div class="item-name-mini">${item.name}</div></div>`;
        });
        itemsHtml += `</div>`;
        
        itemsBox.innerHTML = itemsHtml;
      } else {
        itemsBox.innerHTML = "Сборка скоро появится.";
      }

      document.getElementById('countersBox').innerHTML = hero.countersInfo || "Информация скоро появится.";

      document.getElementById('itemsBox').style.display = 'none';
      document.getElementById('countersBox').style.display = 'none';

      const skillsContainer = document.getElementById('modalSkills');
      skillsContainer.innerHTML = '';

      if (hero.skills) {
        hero.skills.forEach((s, index) => {
          const item = document.createElement('div');
          item.className = 'skill-card';

          if (s.levels) {
            let levelsHtml = '';
            s.levels.forEach(l => {
              levelsHtml += `
                <div class="level-row">
                  <span><b>УР. ${l.lvl}:</b> ${l.effect}</span>
                  <span style="color:#3498db;">${l.mana} | ${l.cd}</span>
                </div>
              `;
            });

            item.innerHTML = `
              <div class="skill-header">
                <img src="${s.img}" class="skill-icon" alt="${s.name}" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/base.png';">
                <div class="skill-info-title">
                  <div class="skill-name">${s.name}</div>
                  <div class="skill-type">${s.isPassive ? 'Пассивная способность' : 'Активная способность'}</div>
                </div>
              </div>
              <div style="font-size: 11px; color: #bbb; margin-top: 6px;" class="skill-desc">${s.desc}</div>
              <button class="toggle-levels-btn" onclick="toggleSkillLvl(${index})">УРОВНИ, МАНА И КУЛДАУН</button>
              <div class="skill-levels-container" id="skillLvl_${index}">
                ${levelsHtml}
              </div>
            `;
          } else {
            item.innerHTML = `
              <div class="skill-name">${s.name}</div>
              <div style="font-size: 11px; color: #bbb;" class="skill-desc">${s.desc}</div>
            `;
          }
          skillsContainer.appendChild(item);
        });
      }

      document.getElementById('heroModal').style.display = 'block';
    }

    function toggleSkillLvl(index) {
      const container = document.getElementById(`skillLvl_${index}`);
      container.style.display = container.style.display === 'block' ? 'none' : 'block';
    }

    function toggleGuideSection(boxId) {
      const box = document.getElementById(boxId);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function closeModal() { document.getElementById('heroModal').style.display = 'none'; }
    function openFeedbackModal() { document.getElementById('feedbackModal').style.display = 'block'; }
    function closeFeedbackModal() { document.getElementById('feedbackModal').style.display = 'none'; }

    function sendFeedback() {
      const text = document.getElementById('feedbackText').value.trim();
      if (!text) return alert("Введите текст");
      alert("Отзыв отправлен!");
      closeFeedbackModal();
    }

    renderHeroes();
  </script>
</body>
</html>
