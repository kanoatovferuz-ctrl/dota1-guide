<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проект X — Гайд по Dota</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0b10;
      color: #e1e1e6;
      min-height: 100vh;
      padding-bottom: 70px;
      position: relative;
    }

    /* Настройка яркости и видимости фона для Samsung / AMOLED */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('Фон Сайта.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.4; /* Оптимальная прозрачность, чтобы фон был отчетливо виден */
      filter: brightness(1.25) contrast(1.1); /* Дополнительная яркость для тёмных экранов */
      z-index: -1;
    }

    header {
      background: rgba(15, 15, 23, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      color: #ff9d00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 15px 10px;
      background: rgba(10, 10, 15, 0.6);
    }

    .tab-btn {
      flex: 1;
      max-width: 120px;
      padding: 10px 0;
      background: rgba(30, 30, 45, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
    }

    .tab-btn.active {
      background: #ff9d00;
      color: #000;
      border-color: #ff9d00;
      box-shadow: 0 0 12px rgba(255, 157, 0, 0.4);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    .hero-card {
      background: rgba(20, 20, 30, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .hero-card:hover {
      transform: translateY(-3px);
      border-color: #ff9d00;
    }

    .hero-avatar {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      background: #111;
      margin-bottom: 8px;
    }

    .hero-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .hero-dota1-name {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: #161622;
      border: 1px solid #ff9d00;
      max-width: 500px;
      margin: 40px auto;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      color: #aaa;
      cursor: pointer;
    }

    .send-tg-btn {
      width: 100%;
      padding: 12px;
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Проект X — Dota Guide</h1>
    <input type="text" id="search" class="search-box" placeholder="Поиск героя (Dota 1 / Dota 2)...">
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="filterCategory('Strength', this)">Strength</button>
    <button class="tab-btn" onclick="filterCategory('Agility', this)">Agility</button>
    <button class="tab-btn" onclick="filterCategory('Intelligence', this)">Intelligence</button>
  </div>

  <div class="container">
    <div class="hero-grid" id="heroGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="heroModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle" style="color: #ff9d00;"></h2>
      <p id="modalDota1" style="color: #888; font-size: 13px; margin-bottom: 10px;"></p>
      <div id="modalBody"></div>
      <button class="send-tg-btn" id="sendTgBtn">Выбрать героя для бота</button>
    </div>
  </div>

  <script>
    // Инициализация Telegram WebApp SDK
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const heroes = [
      { name: "Juggernaut", dota1: "Yurnero", attr: "Agility", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/juggernaut.png", desc: "Мастер клинка, способный наносить непрерывный урон в крутилке." },
      { name: "Sven", dota1: "Rogue Knight", attr: "Strength", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sven.png", desc: "Мощный силовик с массовым станом и огромным уроном под ультимейтом." },
      { name: "Invoker", dota1: "Kael", attr: "Intelligence", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/invoker.png", desc: "Властелин заклинаний, сочетающий сферы Quas, Wex и Exort." },
      { name: "Axe", dota1: "Mogul Khan", attr: "Strength", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/axe.png", desc: "Провоцирует врагов на атаку и рубит их топором при низком здоровье." },
      { name: "Shadow Fiend", dota1: "Nevermore", attr: "Agility", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/nevermore.png", desc: "Собирает души павших врагов для усиления собственных атак." },
      { name: "Crystal Maiden", dota1: "Rylai", attr: "Intelligence", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/crystal_maiden.png", desc: "Маг льда, снабжающий всю команду маной." }
    ];

    let currentAttr = 'Strength';
    let selectedHero = null;

    function renderHeroes() {
      const grid = document.getElementById('heroGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = heroes.filter(h => 
        h.attr === currentAttr && 
        (h.name.toLowerCase().includes(searchVal) || h.dota1.toLowerCase().includes(searchVal))
      );

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.onclick = () => openModal(h);
        card.innerHTML = `
          <img src="${h.img}" class="hero-avatar" alt="${h.name}">
          <div class="hero-name">${h.name}</div>
          <div class="hero-dota1-name">Dota 1: ${h.dota1}</div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(attr, btn) {
      currentAttr = attr;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    document.getElementById('search').addEventListener('input', renderHeroes);

    function openModal(hero) {
      selectedHero = hero;
      document.getElementById('modalTitle').innerText = hero.name;
      document.getElementById('modalDota1').innerText = "В Dota 1: " + hero.dota1;
      document.getElementById('modalBody').innerText = hero.desc;
      document.getElementById('heroModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('heroModal').style.display = 'none';
    }

    document.getElementById('sendTgBtn').addEventListener('click', () => {
      if (tg && selectedHero) {
        tg.sendData(JSON.stringify(selectedHero));
        tg.close();
      } else {
        alert("Выбран герой: " + selectedHero.name);
      }
    });

    // Стартовый рендер
    renderHeroes();
  </script>
</body>
</html>
