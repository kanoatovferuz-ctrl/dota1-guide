<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 1 Classic Guide — Telegram WebApp</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0c0c12;
      color: #e1e1e6;
      min-height: 100vh;
      padding-bottom: 40px;
      position: relative;
    }

    /* Фоновое изображение сайта */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.4;
      filter: brightness(1.25) contrast(1.1);
      z-index: -1;
    }

    header {
      background: rgba(15, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 157, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 18px;
      color: #ff9d00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* Основные вкладки атрибутов */
    .main-tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px 6px 10px;
    }

    .main-tab-btn {
      flex: 1;
      max-width: 130px;
      padding: 10px 0;
      background: rgba(25, 25, 35, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #aaa;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
    }

    .main-tab-btn.active {
      background: #ff9d00;
      color: #000;
      border-color: #ff9d00;
      box-shadow: 0 0 10px rgba(255, 157, 0, 0.4);
    }

    /* Подвкладки Фракций (Sentinel / Scourge) */
    .sub-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 6px 10px 14px 10px;
    }

    .sub-tab-btn {
      padding: 6px 16px;
      background: rgba(15, 15, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #888;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .sub-tab-btn.sentinel.active {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border-color: #2ecc71;
    }

    .sub-tab-btn.scourge.active {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border-color: #e74c3c;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 10px 15px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .hero-card {
      background: rgba(20, 20, 32, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hero-card:active {
      transform: scale(0.97);
    }

    .hero-avatar {
      width: 100%;
      height: 95px;
      object-fit: cover;
      border-radius: 6px;
      background: #151520;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .hero-dota1-name {
      font-size: 11px;
      color: #ff9d00;
      margin-top: 2px;
    }

    /* Модальное окно героя */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-content {
      background: #14141e;
      border: 1px solid #ff9d00;
      max-width: 500px;
      margin: 20px auto;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 24px;
      color: #aaa;
      cursor: pointer;
    }

    .modal-header {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }

    .modal-img {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
    }

    .modal-info h2 {
      font-size: 18px;
      color: #fff;
    }

    .modal-info .dota1-title {
      font-size: 13px;
      color: #ff9d00;
    }

    .bio-text {
      font-size: 12px;
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #0088cc;
    }

    .bio-text p {
      margin-bottom: 8px;
    }
    .bio-text p:last-child {
      margin-bottom: 0;
    }

    .skills-list {
      margin-top: 10px;
    }

    .skill-item {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      border-left: 3px solid #ff9d00;
    }

    .skill-name {
      font-size: 13px;
      font-weight: bold;
      color: #2ecc71;
      margin-bottom: 3px;
    }

    .skill-desc {
      font-size: 12px;
      color: #bbb;
      line-height: 1.4;
    }

    .send-tg-btn {
      width: 100%;
      padding: 12px;
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dota 1 Classic Guide (112 Heroes)</h1>
    <input type="text" id="search" class="search-box" placeholder="Поиск героя (например, Sven, Invoker)...">
  </header>

  <!-- Вкладки Атрибутов -->
  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="setAttr('Strength', this)">Strength</button>
    <button class="main-tab-btn" onclick="setAttr('Agility', this)">Agility</button>
    <button class="main-tab-btn" onclick="setAttr('Intelligence', this)">Intelligence</button>
  </div>

  <!-- Фракции (Sentinel / Scourge) -->
  <div class="sub-tabs">
    <button class="sub-tab-btn sentinel active" onclick="setFaction('Sentinel', this)">🌱 Sentinel (Света)</button>
    <button class="sub-tab-btn scourge" onclick="setFaction('Scourge', this)">💀 Scourge (Тьмы)</button>
  </div>

  <div class="container">
    <div class="hero-grid" id="heroGrid"></div>
  </div>

  <!-- Модальное окно героя -->
  <div class="modal" id="heroModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      
      <div class="modal-header">
        <img id="modalImg" class="modal-img" src="" alt="">
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div id="modalDota1" class="dota1-title"></div>
        </div>
      </div>

      <div id="modalBio" class="bio-text"></div>

      <h3 style="font-size: 13px; color: #ff9d00; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Способности:</h3>
      <div class="skills-list" id="modalSkills"></div>

      <button class="send-tg-btn" id="sendTgBtn">Выбрать героя в Telegram</button>
    </div>
  </div>

  <script>
    // Интеграция с Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Полный реестр всех 112 героев с многоабзацными историями
    const heroesData = [
      // ==================== STRENGTH SENTINEL ====================
      { 
        name: "Sven", dota1: "Rogue Knight", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sven.png", 
        bio: "<p>Сын изгоя-паладина и эльфийки ночного эльфа, Свен вырос с клеймом позора и изгнания, отвергнутый обоими народами. Закаленный суровыми испытаниями, он поклялся следовать непреклонному кодексу ордена Белого Мстителя.</p><p>Однако, столкнувшись с лицемерием и предательством собственных наставников, Свен разрушил священное солнце и уничтожил орден, забрав с собой легендарный двуручный меч Месть.</p><p>Теперь этот одинокий рыцарь блуждает по полям сражений меж двух миров, полагаясь исключительно на свою ярость, стальной клинок и непоколебимую волю.</p>", 
        skills: [{name: "Storm Bolt", desc: "Молот с уроном и станом."}, {name: "Great Cleave", desc: "Пассивный сплеш-урон."}, {name: "Warcry", desc: "Боевой клич на броню и скорость."}, {name: "God's Strength", desc: "Увеличение базового урона."}] 
      },
      { 
        name: "Tiny", dota1: "Stone Giant", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/tiny.png", 
        bio: "<p>Родившись в результате магических катаклизмов из живой скалы, крошечный каменный голем по имени Тайни изначально был лишь ничтожным осколком огромного земного массива.</p><p>С годами он путешествует по миру, непрерывно впитывая в себя обломки пород, минералы и целые деревья, становясь всё массивнее, сильнее и разрушительнее.</p><p>Его главная цель в жизни — узнать своё истинное происхождение и найти свои глубокие «корни» среди великих горных вершин.</p>", 
        skills: [{name: "Avalanche", desc: "Камнепад по площади."}, {name: "Toss", desc: "Бросок юнита."}, {name: "Tree Grab", desc: "Удар деревом."}, {name: "Grow", desc: "Рост размера и урона."}] 
      },
      { 
        name: "Kunkka", dota1: "Admiral", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/kunkka.png", 
        bio: "<p>Легендарный адмирал флота людей, чья некогда непобедимая армада пала в глубоких водах во время яростной битвы с демонами Тьмы у проклятого Водоворота.</p><p>Чудом выжив в том кошмаре ценой собственной гибели или рассудка, Кункка теперь является призрачным фантомом прошлых штормов.</p><p>Он вызывает духов погибших кораблей и призывает разрушительное цунами, чтобы отомстить силам Scourge за гибель своих матросов.</p>", 
        skills: [{name: "Torrent", desc: "Гейзер воды."}, {name: "Tidebringer", desc: "Мощный удар меча."}, {name: "X Marks the Spot", desc: "Метка возврата."}, {name: "Ghost Ship", desc: "Призрачный корабль с ромом."}] 
      },
      { 
        name: "Beastmaster", dota1: "Rexxar", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/beastmaster.png", 
        bio: "<p>Наполовину орк, наполовину мок'натал, Рексар с самого детства познал всю жестокость выживания в диких, нетронутых землях.</p><p>Обладая уникальным врожденным даром говорить со зверями, он приручил могучего медведя Мишу и дикого ястреба.</p><p>Рексар сражается на стороне Сентинел не ради политических интриг, а чтобы защитить дикую природу и доказать преданность своему народу.</p>", 
        skills: [{name: "Wild Axes", desc: "Два топора."}, {name: "Call of the Wild", desc: "Призыв зверей."}, {name: "Inner Beast", desc: "Аура скорости атаки."}, {name: "Primal Roar", desc: "Оглушающий рев."}] 
      },
      { 
        name: "Dragon Knight", dota1: "Davion", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/dragon_knight.png", 
        bio: "<p>Отважный рыцарь Давион в честном, кровопролитном бою сразил древнего и доживающего свой век дракона по имени Шайрокер.</p><p>Вместо того чтобы погибнуть от ран, великий змей передал рыцарю свою кровь, боевой опыт и древнюю мудрость.</p><p>Теперь в жилах Давиона пылает драконье пламя, позволяющее ему в минуты ярости обращаться в крылатого монстра.</p>", 
        skills: [{name: "Breathe Fire", desc: "Огненное дыхание."}, {name: "Dragon Blood", desc: "Броня и регенерация."}, {name: "Dragon Tail", desc: "Стан щитом."}, {name: "Elder Dragon Form", desc: "Превращение в дракона."}] 
      },
      { 
        name: "Clockwerk", dota1: "Rattletrap", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/rattletrap.png", 
        bio: "<p>Рэтлтрап — гениальный изобретатель из горного клана кезанов, создававший сложные механизмы для защиты своего народа.</p><p>После того как его родной город был стерт с лица земли в ходе бесконечных войн, он облачил себя в высокотехнологичный паровой доспех.</p><p>Используя крюки, ракеты и силовые шестерни, этот неутомимый инженер без колебаний врывается в эпицентр сражений.</p>", 
        skills: [{name: "Battery Assault", desc: "Залп мини-ракетами."}, {name: "Power Cogs", desc: "Электрическая ловушка."}, {name: "Rocket Flare", desc: "Глобальная ракета."}, {name: "Hookshot", desc: "Крюк-лебедка."}] 
      },
      { 
        name: "Omniknight", dota1: "Purist Thunderwrath", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/omniknight.png", 
        bio: "<p>Пурист Тандерврат долгие годы преданно служил ордену Повелителя Света, охраняя священные реликвии и свято веря в идеалы.</p><p>Столкнувшись с суровой правдой о несовершенстве церкви, он не отрекся от веры, а решил сам стать воплощением защиты.</p><p>Его святая молитва способна исцелять союзников и полностью ограждать их от любого физического урона.</p>", 
        skills: [{name: "Purification", desc: "Лечение и урон вокруг."}, {name: "Repel", desc: "Иммунитет к магии."}, {name: "Degen Aura", desc: "Замедление врагов рядом."}, {name: "Guardian Angel", desc: "Полная защита от физ. урона."}] 
      },
      { 
        name: "Huskar", dota1: "Sacred Warrior", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/huskar.png", 
        bio: "<p>Будучи воином троллей из племени Даззарей, Хускар был принесен в жертву древним богам, но жрецы вернули его из небытия.</p><p>Это дало ему невероятную мистическую силу, которая питается его собственной болью и пролитой кровью.</p><p>Чем ближе Хускар подходит к грани гибели, тем яростнее и быстрее он мещет горящие копья во врагов.</p>", 
        skills: [{name: "Inner Vitality", desc: "Лечение от силы."}, {name: "Burning Spears", desc: "Горящие копья."}, {name: "Berserker's Blood", desc: "Ускорение при потере HP."}, {name: "Life Break", desc: "Прыжок с потерей здоровья цели."}] 
      },
      { 
        name: "Alchemist", dota1: "Razzil Darkbrew", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/alchemist.png", 
        bio: "<p>Безумный алхимик Раззил и его огромный напарник прославились своими опасными и взрывоопасными экспериментами.</p><p>Пытаясь превратить камни в золото, они случайно разрушили лабораторию и оказались заперты в тюрьме.</p><p>Там Раззил создал новый состав из кислот, напоил напарника и вместе они пробили стены тюрьмы.</p>", 
        skills: [{name: "Acid Spray", desc: "Кислотная лужа."}, {name: "Unstable Concoction", desc: "Взрывающаяся колба."}, {name: "Greevil's Greed", desc: "Бонус золота."}, {name: "Chemical Rage", desc: "Ярость алхимика."}] 
      },
      { 
        name: "Brewmaster", dota1: "Mangix", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/brewmaster.png", 
        bio: "<p>Мангикс принадлежит к древнему народу панд, чья культура строится на искусстве брожения и духовной гармонии.</p><p>Пройдя тяжелейшие испытания старейшин, он унаследовал почетный титул Мастера Пивоварения.</p><p>В бою он использует хмельные напитки и разделяется на три стихийных аспекта — Землю, Шторм и Огонь.</p>", 
        skills: [{name: "Thunder Clap", desc: "Топот и замедление."}, {name: "Drunken Brawler", desc: "Уклонение и криты."}, {name: "Drunken Haze", desc: "Мазилка от атаки."}, {name: "Primal Split", desc: "Разделение на 3 стихии."}] 
      },
      { 
        name: "Treant Protector", dota1: "Rooftrellen", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/treant.png", 
        bio: "<p>Руфтреллен — древний живой дух леса, один из немногих выживших стражей некогда великих чащоб Азерота.</p><p>Он обладает невероятным терпением, сливаясь с деревьями и оставаясь абсолютно невидимым для посторонних глаз.</p><p>Когда лесу угрожает опасность, он оживляет землю и пускает исполинские корни, опутывая врагов.</p>", 
        skills: [{name: "Nature's Guise", desc: "Невидимость у деревьев."}, {name: "Leech Seed", desc: "Вытягивание жизни."}, {name: "Living Armor", desc: "Защита башен и союзников."}, {name: "Overgrowth", desc: "Массовые корни."}] 
      },
      { 
        name: "Centaur Warrunner", dota1: "Bradwarden", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/centaur.png", 
        bio: "<p>Брадварден прошел долгий путь от обычного гладиатора на аренах до величайшего воина своего народа.</p><p>Заслужив право носить священные пояса силы, он объединил мощь массивного тела с боевым духом.</p><p>Его топоры наносят разрушительные удары, а сокрушительный топот оглушает врагов вокруг.</p>", 
        skills: [{name: "Hoof Stomp", desc: "Массовый стан."}, {name: "Double Edge", desc: "Удар ценой части HP."}, {name: "Return", desc: "Пассивный возврат урона."}, {name: "Stampede", desc: "Глобальный бег команды."}] 
      },
      { 
        name: "Earthshaker", dota1: "Raigor Stonehoof", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/earthshaker.png", 
        bio: "<p>Райгор Стоунхуф отделился от подземного племени каменных духов и отправился в странствие с тотемом из скалы.</p><p>Он черпает силу из глубин земли, превращая малейшее движение противников в их собственную гибель.</p><p>Его толчки раскалывают почву, создавая непроходимые разломы в гуще битвы.</p>", 
        skills: [{name: "Fissure", desc: "Разлом-стена."}, {name: "Enchant Totem", desc: "Заряд тотема."}, {name: "Aftershock", desc: "Стан от магии."}, {name: "Echo Slam", desc: "Эхо-удар по площади."}] 
      },
      { 
        name: "Elder Titan", dota1: "Tauren Chieftain", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/elder_titan.png", 
        bio: "<p>Один из древнейших архитекторов мира, участвовавший в самом сотворении материальной вселенной.</p><p>Потеряв физическую оболочку при расколе мира, он странствует в виде духовного воина с проекцией.</p><p>Он возвращает гармонию мироздания, сокрушая тела и разум врагов.</p>", 
        skills: [{name: "Echo Stomp", desc: "Топот духа и героя."}, {name: "Ancestral Spirit", desc: "Вызов проекции."}, {name: "Natural Order", desc: "Срез брони и магии."}, {name: "Earth Splitter", desc: "Раскол мира."}] 
      },
      { 
        name: "Io", dota1: "Guardian Wisp", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/wisp.png", 
        bio: "<p>Ио — блуждающий комок чистой энергии и первородного света, существовавший ещё до зарождения времени.</p><p>Оно пребывает во всех измерениях одновременно, тесно связывая свою судьбу с выбранными союзниками.</p><p>Ио усиливает скорость атаки, а также мгновенно перемещает себя и напарника в бой.</p>", 
        skills: [{name: "Tether", desc: "Связь с союзником."}, {name: "Spirits", desc: "Орбитальные огоньки."}, {name: "Overcharge", desc: "Ускорение ценой HP."}, {name: "Relocate", desc: "Телепортация с напарником."}] 
      },
      { 
        name: "Phoenix", dota1: "Icarus", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/phoenix.png", 
        bio: "<p>Феникс Икар — воплощение звёздного пламени и рождения космических тел, сошедшее на землю птицей.</p><p>В бою он сжигает врагов лучами чистой солнечной энергии и исцеляет своих товарищей.</p><p>Когда силы иссякают, он сгорает в сверхновой звезде, чтобы возродиться из пепла.</p>", 
        skills: [{name: "Icarus Dive", desc: "Огненный полет."}, {name: "Fire Spirits", desc: "Бросок духов."}, {name: "Sun Ray", desc: "Солнечный луч."}, {name: "Supernova", desc: "Превращение в сверхновую звезду."}] 
      },
      { 
        name: "Tusk", dota1: "Ymir", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/tusk.png", 
        bio: "<p>Имир — грозный и веселый морж-воин из ледяных пустошей, любящий драки и крепкий эль.</p><p>Он мастерски владеет холодом, призывая ледяные глыбы для изоляции противников.</p><p>Его фирменный апперкот отправляет врага в воздух, нанося сокрушительный удар.</p>", 
        skills: [{name: "Ice Shards", desc: "Ледяная преграда."}, {name: "Snowball", desc: "Снежный ком с командой."}, {name: "Frozen Sigil", desc: "Ледяной знак замедления."}, {name: "Walrus PUNCH!", desc: "Критический апперкот."}] 
      },

      // ==================== STRENGTH SCOURGE ====================
      { 
        name: "Axe", dota1: "Mogul Khan", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/axe.png", 
        bio: "<p>Могул Хан был рядовым орком, методично убивавшим командиров, пока не провозгласил себя полководцем.</p><p>Он презрительно относится к тактике, предпочитая решать любые споры ударом топора.</p><p>Его клич заставляет врагов атаковать его, а слабых противников он казнит на месте.</p>", 
        skills: [{name: "Berserker's Call", desc: "Провокация врагов."}, {name: "Battle Hunger", desc: "Периодический урон."}, {name: "Counter Helix", desc: "Контратака кручением."}, {name: "Culling Blade", desc: "Казнь слабого."}] 
      },
      { 
        name: "Sand King", dota1: "Crixalis", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sand_king.png", 
        bio: "<p>Криксалис — разумный экзоскелет, рожденный магией бесконечных песчаных бурь пустыни Квант.</p><p>Будучи верным стражем подземного лабиринта, он в совершенстве владеет скрытностью.</p><p>Он зарывается в песок, внезапно обрушивая на врагов шипы и ядовитые бури.</p>", 
        skills: [{name: "Burrowstrike", desc: "Уход под землю со станом."}, {name: "Sand Storm", desc: "Песчаная невидимость."}, {name: "Caustic Finale", desc: "Ядовитый взрыв трупа."}, {name: "Epicenter", desc: "Мощное землетрясение."}] 
      },
      { 
        name: "Slardar", dota1: "Slithereen Guard", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/slardar.png", 
        bio: "<p>Слардар — страж глубин океана из расы наг-сильвериенов, охраняющий затонувшие города.</p><p>Благодаря прочной чешуе и хвосту он легко сокрушает врагов даже на суше.</p><p>Его способность ослеплять светом делает уязвимой любую вражескую защиту.</p>", 
        skills: [{name: "Sprint", desc: "Ускорение бега."}, {name: "Slithereen Crush", desc: "Стан хвостом."}, {name: "Bash of the Deep", desc: "Пассивное оглушение."}, {name: "Corrosive Haze", desc: "Снижение брони цели."}] 
      },
      { 
        name: "Tidehunter", dota1: "Leviathan", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/tidehunter.png", 
        bio: "<p>Левиафан — древнее морское чудовище, веками обитавшее на дне океанских впадин.</p><p>Обладая колоссальной массой и шкурой, он игнорирует магические атаки.</p><p>В бою он вызывает разрушительные цунами и шипы, разметая отряды врагов.</p>", 
        skills: [{name: "Gush", desc: "Водная струя со срезкой брони."}, {name: "Kraken Shell", desc: "Блокировка урона."}, {name: "Anchor Smash", desc: "Удар якорем по площади."}, {name: "Ravage", desc: "Массовое щупальцевое цунами."}] 
      },
      { 
        name: "Skeleton King", dota1: "King Leoric", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/skeleton_king.png", 
        bio: "<p>Король Леорих правил великим царством людей, но из-за темных проклятий пал в скелета.</p><p>Его жажда власти пережила смерть, поэтому он неизменно восстает из пепла.</p><p>Его прикосновение замедляет врагов, а клинок сеет ужас в рядах противника.</p>", 
        skills: [{name: "Hellfire Blast", desc: "Огненный стан."}, {name: "Vampiric Spirit", desc: "Вампиризм и призыв скелетов."}, {name: "Mortal Strike", desc: "Критический удар."}, {name: "Reincarnation", desc: "Возрождение после смерти."}] 
      },
      { 
        name: "Lifestealer", dota1: "N'aix", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/lifestealer.png", 
        bio: "<p>Наикс был жестоким вором в тюрьме Бикозен, где безумие поглотило его разум.</p><p>Его тело превратилось в иссушенный скелет, одержимый жаждой плоти.</p><p>Он вселяется в тела живых существ, разрывая их изнутри и поглощая силы.</p>", 
        skills: [{name: "Rage", desc: "Иммунитет к магии и скорость."}, {name: "Feast", desc: "Урон и вампиризм в % от HP."}, {name: "Open Wounds", desc: "Замедление и лечение от атак."}, {name: "Infest", desc: "Вселение в юнита."}] 
      },
      { 
        name: "Night Stalker", dota1: "Balanar", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/night_stalker.png", 
        bio: "<p>Баланар — хищник из эпохи, предшествовавшей появлению солнца и света.</p><p>Он питает лютую ненависть к живому и сильнее, когда опускается тьма.</p><p>Его когти разрывают броню, а способность призывать ночь сеет панику.</p>", 
        skills: [{name: "Void", desc: "Ночной урон и замедление."}, {name: "Crippling Fear", desc: "Безмолвие и мазилка."}, {name: "Hunter in the Night", desc: "Скорость во тьме."}, {name: "Darkness", desc: "Призыв вечной ночи."}] 
      },
      { 
        name: "Doom", dota1: "Lucifer", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/doom.png", 
        bio: "<p>Люцифер был изгнан из светлых миров за отказ преклонить колено, пав в бездну.</p><p>Закованный в латы из пламени, он накладывает проклятие погибели на врагов.</p><p>Его палящая аура и горящий меч оставляют от противников лишь пепел.</p>", 
        skills: [{name: "Devour", desc: "Поедание крипа и бонус золота."}, {name: "Scorched Earth", desc: "Огненная земля."}, {name: "Infernal Blade", desc: "Горящий стан с % урона."}, {name: "Doom", desc: "Запрет магии и сжигание цели."}] 
      },
      { 
        name: "Spirit Breaker", dota1: "Barathrum", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/spirit_breaker.png", 
        bio: "<p>Баратрум — элементаль из подземных миров, соединивший черты зверя и духа.</p><p>Он мчится по полю боя с невероятной скоростью, сбивая с ног противников.</p><p>Его тяжелая булава наносит сокрушительные удары при каждом взмахе.</p>", 
        skills: [{name: "Charge of Darkness", desc: "Неудержимый разгон на цель."}, {name: "Empowering Haste", desc: "Аура скорости и урона."}, {name: "Greater Bash", desc: "Шанс оглушить и оттолкнуть."}, {name: "Nether Strike", desc: "Телепортация за спину с ударом."}] 
      },
      { 
        name: "Lycan", dota1: "Banehallow", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/lycan.png", 
        bio: "<p>Банехолоу когда-то был лордом, но его семью прокляли, превратив в оборотня.</p><p>Он принял звериную сущность и теперь повелевает стаями диких волков.</p><p>В бою он обращается в волка, чья ярость возрастает с каждой секундой.</p>", 
        skills: [{name: "Summon Wolves", desc: "Призыв волков."}, {name: "Howl", desc: "Вопль на урон и броню."}, {name: "Feral Impulse", desc: "Пассивный урон и реген стаи."}, {name: "Shapechanger", desc: "Превращение в волка."}] 
      },
      { 
        name: "Chaos Knight", dota1: "Nessaj", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/chaos_knight.png", 
        bio: "<p>Нессадж — физическое воплощение энтропии и хаоса мультивселенной.</p><p>Он странствует из мира в мир, сея разрушения и уничтожая любой порядок.</p><p>Хаос разделяет его на копии, окружающие врагов и не дающие им шанса.</p>", 
        skills: [{name: "Chaos Bolt", desc: "Случайный стан и урон."}, {name: "Reality Rift", desc: "Рывок к цели со смещением."}, {name: "Chaos Strike", desc: "Крит с вампиризмом."}, {name: "Phantasm", desc: "Призыв армии иллюзий."}] 
      },
      { 
        name: "Undying", dota1: "Dirge", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/undying.png", 
        bio: "<p>Дирж погиб в ходе темных ритуалов жрецов, вернувшись вестником апокалипсиса.</p><p>Он повелевает нежитью и ставит чумные надгробия, вытягивающие силы.</p><p>Чем дольше длится бой, тем опаснее становится этот ходячий мертвец.</p>", 
        skills: [{name: "Decay", desc: "Кража силы по области."}, {name: "Soul Rip", desc: "Лечение/урон от юнитов."}, {name: "Tombstone", desc: "Надгробие с зомби."}, {name: "Flesh Golem", desc: "Превращение в голема."}] 
      },
      { 
        name: "Magnus", attr: "Strength", faction: "Scourge", dota1: "Magnataur", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/magnus.png", 
        bio: "<p>Магнатаур — рогатое создание из заснеженных гор, чей клан уничтожили враги.</p><p>Охваченный местью, он направил ярость в разрушительные удары копья.</p><p>Его волна и стяжка собирают противников в кучу для неминуемой гибели.</p>", 
        skills: [{name: "Shockwave", desc: "Ударная волна."}, {name: "Empower", desc: "Бонус урона и сплеш на меч."}, {name: "Skewer", desc: "Пронзающий рывок с врагами."}, {name: "Reverse Polarity", desc: "Массовая стяжка в кучу."}] 
      },
      { 
        name: "Abaddon", dota1: "Lord of Avernus", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/abaddon.png", 
        bio: "<p>Лорд Авернуса вырос у источников темной энергии, дарующей власть над смертью.</p><p>Он облачен в призрачные доспехи, а его клинок пропитан мистической силой.</p><p>Абаддон поглощает урон, превращая его в щит и исцеляя союзников.</p>", 
        skills: [{name: "Mist Coil", desc: "Исцеление ценой HP."}, {name: "Aphotic Shield", desc: "Поглощающий урон щит."}, {name: "Curse of Avernus", desc: "Замедление и сало с атаки."}, {name: "Borrowed Time", desc: "Перевод урона в лечение."}] 
      },
      { 
        name: "Pudge", dota1: "Butcher", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png", 
        bio: "<p>Мясник Пудж бродит по полям сражений, собирая остатки павших воинов.</p><p>Он подтягивает врагов ржавым крюком в свои объятия, растворяя в кислоте.</p><p>Его чудовищная сила и плоть растут с каждой поглощенной душой.</p>", 
        skills: [{name: "Meat Hook", desc: "Мясницкий крюк."}, {name: "Rot", desc: "Ядовитая гниль."}, {name: "Flesh Heap", desc: "Накопление силы."}, {name: "Dismember", desc: "Расчленение цели."}] 
      },
      { 
        name: "Underlord", dota1: "Pit Lord", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/underlord.png", 
        bio: "<p>Азгалор — демон преисподней Scourge, командующий легионами разрушения.</p><p>Он изрыгает ядовитое пламя и создает огненные ловушки, пожирающие врагов.</p><p>Его главная сила — открывать разломы для телепортации всей армии.</p>", 
        skills: [{name: "Firestorm", desc: "Огненный шторм."}, {name: "Pit of Malice", desc: "Огненная лужа-сетка."}, {name: "Atrophy Aura", desc: "Срез урона врагов."}, {name: "Fiend's Gate", desc: "Портал телепортации."}] 
      },
      { 
        name: "Bristleback", dota1: "Rigwarl", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/bristleback.png", 
        bio: "<p>Ригварл — драчливый представитель дикого народа, всегда лезущий на рожон.</p><p>Его толстая кожа и колючая спина выдерживают град ударов и стрел.</p><p>Когда враги атакуют его сзади, он выпускает в них шквал острых игл.</p>", 
        skills: [{name: "Viscous Nasal Goo", desc: "Слизь на броню и бег."}, {name: "Quill Spray", desc: "Игольчатый спрей."}, {name: "Bristleback", desc: "Пассивное снижение урона со спины."}, {name: "Warpath", desc: "Ускорение и урон от заклинаний."}] 
      },
      { 
        name: "Legion Commander", dota1: "Tresdin", attr: "Strength", faction: "Scourge", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/legion_commander.png", 
        bio: "<p>Тресдин командовала защитниками города, но после падения стен заключила сделку со Стьмой.</p><p>Вооружившись двумя клинками, она вызывает врагов на смертельную дуэль.</p><p>В победной схватке она забирает боевую силу павших оппонентов.</p>", 
        skills: [{name: "Overwhelming Odds", desc: "Урон от числа врагов."}, {name: "Press the Attack", desc: "Исцеление и атака."}, {name: "Moment of Courage", desc: "Контратака при ударе."}, {name: "Duel", desc: "Смертельная дуэль на урон."}] 
      },
      { 
        name: "Dawnbreaker", attr: "Strength", faction: "Sentinel", dota1: "Valora", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/dawnbreaker.png", 
        bio: "<p>Валора — древний воин света, созданный для защиты миров от сил тьмы.</p><p>Она орудует массивным небесным молотом, сокрушая скопления врагов.</p><p>Ее божественная сила позволяет ей мгновенно прыгать на помощь союзникам.</p>", 
        skills: [{name: "Starbreaker", desc: "Удары молотом."}, {name: "Celestial Hammer", desc: "Бросок молота с дорогой."}, {name: "Converge", desc: "Возврат молота."}, {name: "Solar Guardian", desc: "Глобальный прыжок к союзникам."}] 
      },
      { 
        name: "Mars", attr: "Strength", faction: "Sentinel", dota1: "Ares", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/mars.png", 
        bio: "<p>Марс — бог войны, отражающий любые фронтальные атаки массивным щитом.</p><p>Он пронзает врагов копьем и запирает их в непреодолимой гладиаторской арене.</p><p>Его величие на поле боя внушает страх даже опытным ветеранам.</p>",

        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/primal_beast.png",

        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/vengefulspirit.png", 
        bio: "<p>Шендельзаре была стражницей, пока предатель не лишил ее крыльев.</p><p>Заключив сделку с духами, она променяла тело на чистую энергию мести.</p><p>Её ключевая способность — менять местами врагов и союзников на поле боя.</p>",

      },

        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/riki.png",

    let currentAttr = 'Strength';
    let currentFaction = 'Sentinel';
    let selectedHero = null;

    function renderHeroes() {
      const grid = document.getElementById('heroGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = heroesData.filter(h => 
        h.attr === currentAttr && 
        h.faction === currentFaction &&
        (h.name.toLowerCase().includes(searchVal) || h.dota1.toLowerCase().includes(searchVal))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">Герои не найдены</div>`;
        return;
      }

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.onclick = () => openModal(h);
        
        // Защита от пропажи изображений
        const fallbackImg = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/base.png";

        card.innerHTML = `
          <img src="${h.img}" class="hero-avatar" alt="${h.name}" onerror="this.onerror=null; this.src='${fallbackImg}';">
          <div class="hero-title">${h.name}</div>
          <div class="hero-dota1-name">Dota 1: ${h.dota1}</div>
        `;
        grid.appendChild(card);
      });
    }

    function setAttr(attr, btn) {
      currentAttr = attr;
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    function setFaction(faction, btn) {
      currentFaction = faction;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    document.getElementById('search').addEventListener('input', renderHeroes);

    function openModal(hero) {
      selectedHero = hero;
      document.getElementById('modalImg').src = hero.img;
      document.getElementById('modalName').innerText = hero.name;
      document.getElementById('modalDota1').innerText = "Имя в Dota 1: " + hero.dota1;
      document.getElementById('modalBio').innerHTML = hero.bio;

      const skillsContainer = document.getElementById('modalSkills');
      skillsContainer.innerHTML = '';

      hero.skills.forEach(s => {
        const item = document.createElement('div');
        item.className = 'skill-item';
        item.innerHTML = `
          <div class="skill-name">${s.name}</div>
          <div class="skill-desc">${s.desc}</div>
        `;
        skillsContainer.appendChild(item);
      });

      document.getElementById('heroModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('heroModal').style.display = 'none';
    }

    document.getElementById('sendTgBtn').addEventListener('click', () => {
      if (tg && selectedHero) {
        tg.sendData(JSON.stringify(selectedHero));
        tg.close();
      } else {
        alert("Выбран герой: " + selectedHero.name + " (" + selectedHero.dota1 + ")");
      }
    });

    // Инициализация при старте
    renderHeroes();
  </script>
</body>
</html>
