<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Classic Guide — Telegram WebApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Russo One', sans-serif !important; 
      letter-spacing: 0.5px;
    }

    body { 
      background-color: #0c0c12; 
      color: #e1e1e6; 
      min-height: 100vh; 
      padding-bottom: 40px; 
      position: relative; 
    }

    body::before { 
      content: ""; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background-image: url('bg.jpg'); 
      background-size: cover; 
      background-position: center top; 
      opacity: 0.4; 
      filter: brightness(1.25) contrast(1.1); 
      z-index: -1; 
    }

    header { 
      background: rgba(15, 15, 25, 0.9); 
      backdrop-filter: blur(10px); 
      padding: 15px 15px 20px 15px; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
      border-bottom: 1px solid rgba(255, 157, 0, 0.3); 
      text-align: center; 
    }

    h1 { 
      font-size: 24px; 
      color: #ff9d00; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 14px; 
    }

    .search-box { 
      width: 100%; 
      max-width: 400px; 
      padding: 10px 14px; 
      border-radius: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      background: rgba(0, 0, 0, 0.6); 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
      margin-top: 4px;
      margin-bottom: 10px; 
    }

    .feedback-trigger-btn { 
      display: inline-block; 
      width: 100%; 
      max-width: 400px; 
      padding: 7px 10px; 
      background: rgba(255, 157, 0, 0.15); 
      border: 1px solid rgba(255, 157, 0, 0.4); 
      color: #ff9d00; 
      font-weight: 600; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 11px; 
      text-transform: uppercase; 
    }

    /* Главные вкладки разделов */
    .nav-tabs { display: flex; justify-content: center; gap: 8px; padding: 12px 10px; background: rgba(10, 10, 18, 0.95); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .nav-btn { flex: 1; max-width: 130px; padding: 10px 4px; background: rgba(35, 35, 50, 0.9); border: 2px solid rgba(255, 157, 0, 0.4); color: #ccc; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; text-align: center; transition: all 0.2s; }
    .nav-btn.active { background: #ff9d00; color: #000; border-color: #ff9d00; box-shadow: 0 0 10px rgba(255,157,0,0.4); }

    /* Второстепенные вкладки атрибутов героев */
    .main-tabs { display: flex; justify-content: center; gap: 6px; padding: 10px 10px 4px 10px; }
    .main-tab-btn { flex: 1; max-width: 130px; padding: 8px 0; background: rgba(25, 25, 35, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); color: #aaa; border-radius: 6px; cursor: pointer; font-size: 10px; text-transform: uppercase; }
    .main-tab-btn.active { background: #3498db; color: #fff; border-color: #3498db; }
    
    .sub-tabs { display: flex; justify-content: center; gap: 8px; padding: 4px 10px 12px 10px; }
    .sub-tab-btn { padding: 6px 16px; background: rgba(15, 15, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #888; border-radius: 20px; cursor: pointer; font-size: 10px; text-transform: uppercase; }
    .sub-tab-btn.sentinel.active { background: rgba(46, 204, 113, 0.25); color: #2ecc71; border-color: #2ecc71; }
    .sub-tab-btn.scourge.active { background: rgba(231, 76, 60, 0.25); color: #e74c3c; border-color: #e74c3c; }

    .container { max-width: 800px; margin: 0 auto; padding: 10px 15px; }
    
    .hero-grid, .items-catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .hero-card { background: rgba(20, 20, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
    
    .item-catalog-card { background: rgba(20, 20, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .hero-avatar { width: 100%; height: 95px; object-fit: cover; border-radius: 6px; background: #151520; margin-bottom: 8px; }
    
    .item-catalog-img { width: 54px; height: 54px; object-fit: contain; background: #000; border: 1px solid rgba(255, 157, 0, 0.4); border-radius: 6px; margin-bottom: 6px; display: block; }
    
    .hero-title, .item-catalog-title { font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .hero-dota1-name, .item-catalog-cost { font-size: 9px; color: #ff9d00; margin-top: 2px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 100; padding: 15px; overflow-y: auto; }
    .modal-content { background: #14141e; border: 1px solid #ff9d00; max-width: 500px; margin: 20px auto; border-radius: 12px; padding: 20px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 15px; font-size: 24px; color: #aaa; cursor: pointer; }
    .modal-header { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .modal-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }
    .modal-info h2 { font-size: 16px; color: #fff; }
    .modal-info .dota1-title { font-size: 11px; color: #ff9d00; }
    
    .bio-text { font-size: 11px; color: #dcdce6; line-height: 1.6; margin-bottom: 12px; background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 8px; border-left: 3px solid #0088cc; }
    .bio-text p { margin-bottom: 8px; }
    
    .guide-dropdown-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 157, 0, 0.3); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .toggle-guide-btn { background: rgba(255, 157, 0, 0.15); border: 1px solid rgba(255, 157, 0, 0.4); color: #ff9d00; font-size: 10px; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; text-align: center; text-transform: uppercase; }
    .guide-content-box { display: none; margin-top: 8px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px; font-size: 11px; color: #ccc; line-height: 1.5; }
    
    .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .item-card-mini { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 5px; text-align: center; }
    .item-icon { width: 36px; height: 36px; border-radius: 4px; border: 1px solid #888; object-fit: cover; background: #000; margin-bottom: 3px; display: block; margin-left: auto; margin-right: auto; }
    .item-name-mini { font-size: 9px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage-title { font-size: 10px; font-weight: bold; color: #ff9d00; margin: 8px 0 4px 0; text-transform: uppercase; }

    .skill-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #ff9d00; }
    .skill-header { display: flex; align-items: center; gap: 10px; }
    .skill-icon { width: 42px; height: 42px; border-radius: 6px; border: 1px solid #ff9d00; object-fit: cover; background: #151520; }
    .skill-info-title { flex: 1; }
    .skill-name { font-size: 12px; color: #2ecc71; }
    .skill-type { font-size: 10px; color: #ff9d00; text-transform: uppercase; }
    
    .toggle-levels-btn { margin-top: 6px; background: rgba(255, 157, 0, 0.12); border: 1px solid rgba(255, 157, 0, 0.3); color: #ff9d00; font-size: 10px; padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; text-align: center; text-transform: uppercase; }
    .skill-levels-container { display: none; margin-top: 6px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 6px; }
    .level-row { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; padding: 3px 0; }
    
    .send-tg-btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; text-transform: uppercase; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1 id="headerTitle">Dota 2 Guide</h1>
    <input type="text" id="search" class="search-box" placeholder="Поиск (герой или предмет)...">
    <button class="feedback-trigger-btn" onclick="openFeedbackModal()">НАПИСАТЬ ОТЗЫВ / ПРЕДЛОЖЕНИЕ</button>
  </header>

  <!-- Главные переключатели разделов -->
  <div class="nav-tabs">
    <button class="nav-btn active" id="navHeroes" onclick="switchSection('heroes')">ГЕРОИ</button>
    <button class="nav-btn" id="navItems" onclick="switchSection('items')">ПРЕДМЕТЫ</button>
    <button class="nav-btn" id="navFuture" onclick="switchSection('future')">БУДУЩЕЕ</button>
  </div>

  <!-- Фильтры для раздела героев -->
  <div id="heroesFilters">
    <div class="main-tabs">
      <button class="main-tab-btn active" onclick="setAttr('Strength', this)">STRENGTH</button>
      <button class="main-tab-btn" onclick="setAttr('Agility', this)">AGILITY</button>
      <button class="main-tab-btn" onclick="setAttr('Intelligence', this)">INTELLIGENCE</button>
    </div>

    <div class="sub-tabs">
      <button class="sub-tab-btn sentinel active" onclick="setFaction('Sentinel', this)">SENTINEL</button>
      <button class="sub-tab-btn scourge" onclick="setFaction('Scourge', this)">SCOURGE</button>
    </div>
  </div>

  <!-- Основной контейнер -->
  <div class="container">
    <div class="hero-grid" id="heroGrid"></div>
    <div class="items-catalog-grid" id="itemsGrid" style="display: none;"></div>
    <div id="futureView" style="display: none; text-align: center; color: #888; padding: 40px; font-size: 14px; text-transform: uppercase;">
      Этот раздел находится в разработке...
    </div>
  </div>

  <!-- Модальное окно героя -->
  <div class="modal" id="heroModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-header">
        <img id="modalImg" class="modal-img" src="" alt="">
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div id="modalDota1" class="dota1-title"></div>
        </div>
      </div>
      
      <div id="modalBio" class="bio-text"></div>

      <div class="guide-dropdown-card">
        <button class="toggle-guide-btn" onclick="toggleGuideSection('itemsBox')">СБОРКА ПРЕДМЕТОВ (BUILD)</button>
        <div class="guide-content-box" id="itemsBox"></div>
      </div>

      <div class="guide-dropdown-card" style="border-color: rgba(46, 204, 113, 0.4);">
        <button class="toggle-guide-btn" style="background: rgba(46, 204, 113, 0.15); border-color: rgba(46, 204, 113, 0.4); color: #2ecc71;" onclick="toggleGuideSection('countersBox')">КОНТРПИКИ И СОВЕТЫ</button>
        <div class="guide-content-box" id="countersBox"></div>
      </div>

      <h3 style="font-size: 12px; color: #ff9d00; margin: 12px 0 8px 0; text-transform: uppercase;">СПОСОБНОСТИ:</h3>
      <div class="skills-list" id="modalSkills"></div>
      
      <button class="send-tg-btn" onclick="closeModal()">ЗАКРЫТЬ</button>
    </div>
  </div>

  <!-- Модальное окно предмета -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeItemModal()">&times;</span>
      <div class="modal-header">
        <img id="itemModalImg" class="modal-img" src="" alt="" style="width: 54px; height: 54px; object-fit: contain; background: #000; border: 1px solid #ff9d00; border-radius: 6px;">
        <div class="modal-info">
          <h2 id="itemModalName"></h2>
          <div id="itemModalCost" class="dota1-title"></div>
        </div>
      </div>
      
      <div class="bio-text" id="itemModalDesc"></div>

      <div class="guide-dropdown-card">
        <div style="font-size: 11px; color: #ff9d00; margin-bottom: 6px; text-transform: uppercase;">Рецепт (Компоненты):</div>
        <div id="itemModalRecipe" class="items-grid"></div>
      </div>

      <div class="guide-dropdown-card" style="border-color: rgba(52, 152, 219, 0.4);">
        <div style="font-size: 11px; color: #3498db; margin-bottom: 4px; text-transform: uppercase;">Кому подходит (Лучшие герои):</div>
        <div id="itemModalHeroes" style="font-size: 11px; color: #ccc;"></div>
      </div>

      <div class="guide-dropdown-card" style="border-color: rgba(231, 76, 60, 0.4);">
        <div style="font-size: 11px; color: #e74c3c; margin-bottom: 4px; text-transform: uppercase;">Против кого эффективен:</div>
        <div id="itemModalCounters" style="font-size: 11px; color: #ccc;"></div>
      </div>
      
      <button class="send-tg-btn" onclick="closeItemModal()">ЗАКРЫТЬ</button>
    </div>
  </div>

  <!-- Модальное окно отзыва -->
  <div class="modal" id="feedbackModal">
    <div class="modal-content" style="max-width: 400px; margin-top: 50px;">
      <span class="close-btn" onclick="closeFeedbackModal()">&times;</span>
      <h2 style="font-size: 14px; color: #ff9d00; margin-bottom: 12px; text-transform: uppercase;">Обратная связь</h2>
      <textarea id="feedbackText" placeholder="Ваше сообщение..." style="width: 100%; height: 90px; padding: 10px; border-radius: 6px; background: #0c0c12; color: #fff; border: 1px solid rgba(255,255,255,0.2); resize: none; margin-bottom: 12px; font-size: 12px;"></textarea>
      <button onclick="sendFeedback()" class="send-tg-btn" style="background: #2ecc71; margin-top: 0;">ОТПРАВИТЬ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    let currentSection = 'heroes';

    // База предметов
    const itemsData = [
      { name: "Tango", cost: "Цена: 90 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/tango.png", desc: "Поедает дерево, восстанавливая HP.", recipeItems: [], heroes: "Всем героям на линии.", counters: "Ранний размен." },
      { name: "Healing Salve", cost: "Цена: 100 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/flask.png", desc: "Восстанавливает 400 HP.", recipeItems: [], heroes: "Лейнеры.", counters: "Быстрый отхил." },
      { name: "Blink Dagger", cost: "Цена: 2250 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/blink.png", desc: "Мгновенная телепортация.", recipeItems: [], heroes: "Инициаторы.", counters: "Сокращение дистанции." },
      { name: "Shadow Blade", cost: "Цена: 3000 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/invis_sword.png", desc: "Дает невидимость и урон с руки.", recipeItems: [{ name: "Amulet", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/shadow_amulet.png" }, { name: "Claymore", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/claymore.png" }], heroes: "Sniper, SF, Slark.", counters: "Ганки." },
      { name: "Black King Bar", cost: "Цена: 4050 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/black_king_bar.png", desc: "Иммунитет к магии.", recipeItems: [{ name: "Ogre Axe", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/ogre_axe.png" }, { name: "Hammer", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/mithril_hammer.png" }, { name: "Recipe", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/recipe.png" }], heroes: "Керри.", counters: "Станы и магия." },
      { name: "Daedalus", cost: "Цена: 5100 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/greater_crit.png", desc: "Шанс критического удара 225%.", recipeItems: [{ name: "Crystalys", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/lesser_crit.png" }, { name: "Demon Edge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/demon_edge.png" }, { name: "Recipe", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/recipe.png" }], heroes: "Sven, Sniper.", counters: "Урон." },
      { name: "Manta Style", cost: "Цена: 4600 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/manta.png", desc: "Создает иллюзии, сбрасывает дебафы.", recipeItems: [{ name: "Yasha", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/yasha.png" }, { name: "Orb", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/ultimate_orb.png" }, { name: "Recipe", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/recipe.png" }], heroes: "AM, Luna.", counters: "Сейв." },
      { name: "Satanic", cost: "Цена: 5050 золота", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/satanic.png", desc: "Вампиризм 175% при активации.", recipeItems: [{ name: "Mask", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/lifesteal.png" }, { name: "Blade", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/blade_of_alacrity.png" }, { name: "Reaver", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/reaver.png" }], heroes: "Ursa, Sven.", counters: "Выживаемость." }
    ];

    // База героев (полный список 112+ героев по атрибутам и фракциям)
    const heroesData = [
      // СИЛА (STRENGTH) — SENTINEL
      { 
        name: "Sven", dota1: "Rogue Knight", attr: "Strength", faction: "Sentinel", 
        img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sven.png", 
        bio: "<p>Сын изгоя-паладина, Свен поклялся следовать кодексу ордена, но позже разрушил его.</p>",

          late: [{ name: "Daedalus", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/greater_crit.png" }]
        },
        countersInfo: "Силен с дизейблерами. Уязвим к Bane.",
        skills: [
          { name: "Storm Bolt", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/sven_storm_bolt.png", desc: "Молот стана.", isPassive: false, levels: [{ lvl: 1, mana: "110 МАНА", cd: "18 СЕК", effect: "110 урона" }] }

      },
      { name: "Tiny", dota1: "Stone Giant", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/tiny.png", bio: "<p>Каменный гигант.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Сейв.", skills: [] },
      { name: "Centrunner", dota1: "Centaur Warrunner", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/centaur.png", bio: "<p>Братство воина.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Танк.", skills: [] },
      { name: "Dragon Knight", dota1: "Knight Davion", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/dragon_knight.png", bio: "<p>Рыцарь дракона.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Пуш.", skills: [] },
      { name: "Omniknight", attr: "Strength", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/omniknight.png", bio: "<p>Паладин света.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Хил.", skills: [] },

      // СИЛА (STRENGTH) — SCOURGE
      { name: "Pudge", dota1: "Butcher", attr: "Strength", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png", bio: "<p>Мясник с крюком.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Ганк.", skills: [] },

      { name: "Anti-Mage", attr: "Agility", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/antimage.png", bio: "<p>Убийца магов.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Блинк.", skills: [] },
      { name: "Luna", attr: "Agility", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/luna.png", bio: "<p>Лунный всадник.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Глейвы.", skills: [] },

      // ЛОВКОСТЬ (AGILITY) — SCOURGE
      { name: "Shadow Fiend", dota1: "Nevermore", attr: "Agility", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/nevermore.png", bio: "<p>Повелитель душ.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Койны.", skills: [] },
      { name: "Sniper", dota1: "Kardel", attr: "Agility", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/sniper.png", bio: "<p>Дальний стрелок.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Хедшоты.", skills: [] },
      { name: "Slark", attr: "Agility", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/slark.png", bio: "<p>Беглец из Темного Рифа.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Кража статов.", skills: [] },

      // ИНТЕЛЛЕКТ (INTELLIGENCE) — SENTINEL
      { name: "Crystal Maiden", dota1: "Rylai", attr: "Intelligence", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/crystal_maiden.png", bio: "<p>Маг льда.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Аура маны.", skills: [] },
      { name: "Lina", dota1: "Inverse", attr: "Intelligence", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/lina.png", bio: "<p>Повелительница огня.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Лагуна.", skills: [] },
      { name: "Zeus", attr: "Intelligence", faction: "Sentinel", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/zuus.png", bio: "<p>Бог молний.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Ульт.", skills: [] },

      // ИНТЕЛЛЕКТ (INTELLIGENCE) — SCOURGE
      { name: "Lion", dota1: "Demon Witch", attr: "Intelligence", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/lion.png", bio: "<p>Демонический колдун.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Двойной стан.", skills: [] },
      { name: "Invoker", dota1: "Kael", attr: "Intelligence", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/invoker.png", bio: "<p>Великий маг.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Сферы.", skills: [] },
      { name: "Witch Doctor", attr: "Intelligence", faction: "Scourge", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/witch_doctor.png", bio: "<p>Знахарь вуду.</p>", itemsBuild: { early: [], mid: [], late: [] }, countersInfo: "Ульт.", skills: [] }
    ];

    let currentAttr = 'Strength', currentFaction = 'Sentinel';

    function switchSection(section) {
      currentSection = section;
      document.getElementById('navHeroes').classList.remove('active');
      document.getElementById('navItems').classList.remove('active');
      document.getElementById('navFuture').classList.remove('active');

      document.getElementById('heroGrid').style.display = 'none';
      document.getElementById('itemsGrid').style.display = 'none';
      document.getElementById('futureView').style.display = 'none';
      document.getElementById('heroesFilters').style.display = 'none';

      if (section === 'heroes') {
        document.getElementById('navHeroes').classList.add('active');
        document.getElementById('heroGrid').style.display = 'grid';
        document.getElementById('heroesFilters').style.display = 'block';
        document.getElementById('headerTitle').innerText = "Dota 2 Guide";
        renderHeroes();
      } else if (section === 'items') {
        document.getElementById('navItems').classList.add('active');
        document.getElementById('itemsGrid').style.display = 'grid';
        document.getElementById('headerTitle').innerText = "База предметов";
        renderItems();
      } else if (section === 'future') {
        document.getElementById('navFuture').classList.add('active');
        document.getElementById('futureView').style.display = 'block';
        document.getElementById('headerTitle').innerText = "Будущий раздел";
      }
    }

    function renderHeroes() {
      const grid = document.getElementById('heroGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = heroesData.filter(h => 
        h.attr === currentAttr && h.faction === currentFaction &&
        (h.name.toLowerCase().includes(searchVal) || h.dota1.toLowerCase().includes(searchVal))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">Герои не найдены</div>`;
        return;
      }

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.onclick = () => openModal(h);
        const fallbackImg = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/base.png";
        card.innerHTML = `
          <img src="${h.img}" class="hero-avatar" alt="${h.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
          <div class="hero-title">${h.name}</div>
          <div class="hero-dota1-name">Dota 1: ${h.dota1 || 'Classic'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      const searchVal = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = itemsData.filter(i => i.name.toLowerCase().includes(searchVal));

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">Предметы не найдены</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-catalog-card';
        card.onclick = () => openItemModal(item);
        card.innerHTML = `
          <img src="${item.img}" class="item-catalog-img" alt="${item.name}" loading="lazy" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';">
          <div class="item-catalog-title">${item.name}</div>
          <div class="item-catalog-cost">${item.cost}</div>
        `;
        grid.appendChild(card);
      });
    }

    function setAttr(attr, btn) {
      currentAttr = attr;
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    function setFaction(faction, btn) {
      currentFaction = faction;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHeroes();
    }

    document.getElementById('search').addEventListener('input', () => {
      if (currentSection === 'heroes') renderHeroes();
      else if (currentSection === 'items') renderItems();
    });

    function openModal(hero) {
      document.getElementById('modalImg').src = hero.img;
      document.getElementById('modalName').innerText = hero.name;
      document.getElementById('modalDota1').innerText = "Dota 1: " + (hero.dota1 || 'Classic');
      document.getElementById('modalBio').innerHTML = hero.bio;
      
      const itemsBox = document.getElementById('itemsBox');
      if (hero.itemsBuild && hero.itemsBuild.early.length > 0) {
        let itemsHtml = `<div class="stage-title">Начало игры</div><div class="items-grid">`;
        hero.itemsBuild.early.forEach(item => {
          itemsHtml += `<div class="item-card-mini"><img src="${item.img}" class="item-icon" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';"><div class="item-name-mini">${item.name}</div></div>`;
        });
        itemsHtml += `</div><div class="stage-title">Середина игры</div><div class="items-grid">`;
        hero.itemsBuild.mid.forEach(item => {
          itemsHtml += `<div class="item-card-mini"><img src="${item.img}" class="item-icon" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';"><div class="item-name-mini">${item.name}</div></div>`;
        });
        itemsHtml += `</div><div class="stage-title">Лейт / 6 Слотов</div><div class="items-grid">`;
        hero.itemsBuild.late.forEach(item => {
          itemsHtml += `<div class="item-card-mini"><img src="${item.img}" class="item-icon" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';"><div class="item-name-mini">${item.name}</div></div>`;
        });
        itemsHtml += `</div>`;
        itemsBox.innerHTML = itemsHtml;
      } else {
        itemsBox.innerHTML = "Сборка скоро появится.";
      }

      document.getElementById('countersBox').innerHTML = hero.countersInfo || "Информация скоро появится.";
      document.getElementById('itemsBox').style.display = 'none';
      document.getElementById('countersBox').style.display = 'none';

      const skillsContainer = document.getElementById('modalSkills');
      skillsContainer.innerHTML = '';
      if (hero.skills && hero.skills.length > 0) {
        hero.skills.forEach((s, index) => {
          const item = document.createElement('div');
          item.className = 'skill-card';
          let levelsHtml = '';
          if (s.levels) {
            s.levels.forEach(l => {
              levelsHtml += `<div class="level-row"><span><b>УР. ${l.lvl}:</b> ${l.effect}</span><span style="color:#3498db;">${l.mana} | ${l.cd}</span></div>`;
            });
          }
          item.innerHTML = `
            <div class="skill-header">
              <img src="${s.img}" class="skill-icon" alt="${s.name}" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/base.png';">
              <div class="skill-info-title">
                <div class="skill-name">${s.name}</div>
                <div class="skill-type">${s.isPassive ? 'Пассивная способность' : 'Активная способность'}</div>
              </div>
            </div>
            <div style="font-size: 11px; color: #bbb; margin-top: 6px;">${s.desc}</div>
            ${s.levels ? `<button class="toggle-levels-btn" onclick="toggleSkillLvl(${index})">УРОВНИ, МАНА И КУЛДАУН</button><div class="skill-levels-container" id="skillLvl_${index}">${levelsHtml}</div>` : ''}
          `;
          skillsContainer.appendChild(item);
        });
      } else {
        skillsContainer.innerHTML = '<div style="font-size: 11px; color: #888; text-align:center; padding: 10px;">Способности добавляются...</div>';
      }

      document.getElementById('heroModal').style.display = 'block';
    }

    function openItemModal(item) {
      document.getElementById('itemModalImg').src = item.img;
      document.getElementById('itemModalName').innerText = item.name;
      document.getElementById('itemModalCost').innerText = item.cost;
      document.getElementById('itemModalDesc').innerText = item.desc;
      
      const recipeContainer = document.getElementById('itemModalRecipe');
      const recipeCard = recipeContainer.parentElement;

      if (item.recipeItems && item.recipeItems.length > 0) {
        recipeCard.style.display = 'block';
        recipeContainer.innerHTML = '';
        item.recipeItems.forEach(comp => {
          recipeContainer.innerHTML += `
            <div class="item-card-mini">
              <img src="${comp.img}" class="item-icon" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/branches.png';">
              <div class="item-name-mini">${comp.name}</div>
            </div>
          `;
        });
      } else {
        recipeCard.style.display = 'none';
      }

      document.getElementById('itemModalHeroes').innerText = item.heroes || "Универсальный предмет.";
      document.getElementById('itemModalCounters').innerText = item.counters || "По ситуации.";
      document.getElementById('itemModal').style.display = 'block';
    }

    function toggleSkillLvl(index) {
      const container = document.getElementById(`skillLvl_${index}`);
      container.style.display = container.style.display === 'block' ? 'none' : 'block';
    }

    function toggleGuideSection(boxId) {
      const box = document.getElementById(boxId);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function closeModal() { document.getElementById('heroModal').style.display = 'none'; }
    function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }
    function openFeedbackModal() { document.getElementById('feedbackModal').style.display = 'block'; }
    function closeFeedbackModal() { document.getElementById('feedbackModal').style.display = 'none'; }

    function sendFeedback() {
      const text = document.getElementById('feedbackText').value.trim();
      if (!text) return alert("Введите текст");
      alert("Отзыв отправлен!");
      closeFeedbackModal();
    }

    renderHeroes();
  </script>
</body>
</html>
